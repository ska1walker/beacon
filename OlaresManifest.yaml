# ============================================================================
# OlaresManifest.yaml — Beacon
#
# Linter-Regeln, die hier zwingend gelten:
# - metadata.name, metadata.appid, Chart.yaml.name und der Ordnername
#   müssen alle exakt "beacon" sein (^[a-z0-9]{1,30}$, keine Bindestriche)
# - metadata.version muss Chart.yaml.version entsprechen
# - spec.versionName muss Chart.yaml.appVersion entsprechen
# - spec.requiredDisk muss gesetzt sein
# ============================================================================

olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

# Jedes Deployment, das dieses Chart rendert, mit seiner Replikatzahl.
# app-service steuert darüber den Lebenslauf: Die Installation rendert
# zuerst mit 0 und skaliert dann hoch, Anhalten setzt alles auf 0.
workloadReplicas:
  beacon: 1
  beacon-backend: 1
  beacon-links: 1

metadata:
  name: beacon
  appid: beacon
  title: Beacon
  description: Sales CRM that runs entirely on your own box — companies, contacts, deals and an AI assistant that never phones home.
  icon: https://raw.githubusercontent.com/ska1walker/beacon/main/icon.png
  version: 0.9.9
  categories:
    - AI

# ---- Entrances --------------------------------------------------------------
# Nur einer: die Oberfläche. Das Backend bekommt bewusst KEINEN Entrance.
#
# Der Grund ist bei Insilo gemessen worden: Mit einem Entrance sitzt ein
# Envoy-Sidecar vor dem Pod und prüft jeden eingehenden TCP-Verkehr gegen
# Authelia. Die serverseitige Weiterleitung von Next.js trägt aber keine
# Authelia-Kekse und bekam prompt 401. Ohne Entrance läuft das Backend
# ohne Sidecar, Next.js ruft http://beacon-backend:8000 direkt, und die
# Identität reicht der Kopf X-Bfl-User weiter.
entrances:
  - name: beacon
    host: beacon
    port: 3000
    title: Beacon
    icon: https://raw.githubusercontent.com/ska1walker/beacon/main/icon.png
    authLevel: public
    invisible: false
    openMethod: window

  # Der öffentliche Pfad für Links aus Mails: Einwilligung bestätigen,
  # abmelden, Klick zählen. Muss von überall erreichbar sein — der
  # Empfänger klickt aus seinem Mailprogramm. Dahinter liegt eine eigene
  # Anwendung (app/oeffentlich.py), die genau diese drei Dinge kann und
  # nichts liest. `invisible`, weil es keine Seite zum Öffnen ist.
  #
  # Der Entrance zeigt auf ein **eigenes Deployment** (beacon-links), nicht
  # auf das Backend — und das ist keine Ordnungsliebe: Ein Entrance
  # bringt dem Pod einen Envoy-Sidecar, und der prüft *jeden* eingehenden
  # Aufruf gegen Authelia. Hing der Entrance am Backend-Pod, wies der
  # Sidecar die internen API-Aufrufe des Frontends ab (401,
  # ext_authz_denied) — so war die App nach 0.1.10 auf der Box tot
  # (docs/BETRIEB.md, 5.9.2026). Das Backend bleibt ohne Entrance und
  # damit ohne Sidecar.
  - name: beaconlinks
    host: beacon-links
    port: 8001
    title: Beacon Links
    icon: https://raw.githubusercontent.com/ska1walker/beacon/main/icon.png
    authLevel: public
    invisible: true
    openMethod: window

# ---- System-Middleware ------------------------------------------------------
# Olares stellt PostgreSQL bereit und reicht die Zugangsdaten als
# .Values.postgres.* herein. Kein Redis: Es gibt noch keine Hintergrund-
# jobs, und was nicht gebraucht wird, wird nicht angefordert.
middleware:
  postgres:
    username: beacon
    databases:
      - name: beacon
        extensions:
          - pg_trgm      # Trigram-Suche über Firmen- und Personennamen
          - pgcrypto
          - uuid-ossp
        # `vector` fehlt hier, so wie in den Migrationen: Diese Ausbaustufe
        # rechnet keine Einbettungen. Kommt mit der Ask-Funktion.

# ---- Berechtigungen ---------------------------------------------------------
permission:
  # Wird noch von keinem Pfad beschrieben — steht aber hier, weil es die
  # einzige Ablage ist, die eine Deinstallation überlebt. Die Datenbank tut
  # das nicht: Olares legt sie neu an. Für ein CRM heißt das, dass ohne
  # Sicherung sämtliche Firmen, Kontakte und Geschäfte weg wären. Der
  # Ausfuhrpfad dorthin ist der erste Punkt der nächsten Ausbaustufe
  # (siehe docs/BETRIEB.md).
  appData: true

spec:
  versionName: '0.9.9'

  featuredImage: https://raw.githubusercontent.com/ska1walker/beacon/main/icon.png
  promoteImage:
    - https://raw.githubusercontent.com/ska1walker/beacon/main/icon.png

  fullDescription: |
    **Beacon** is a lean sales CRM for teams that cannot send their pipeline
    to a US cloud.

    Companies, contacts, deals on a drag-and-drop pipeline board, an
    activity timeline on every record, and tasks — the parts a sales team
    actually uses, without the rest.

    The AI assistant summarises where an account stands, proposes the next
    step on a deal and drafts outreach. It talks to an OpenAI-compatible
    endpoint that **you** configure — typically a LiteLLM or local model
    app on the same box. There is deliberately no default: nothing is sent
    anywhere until you enter an address, and the app says so plainly
    instead of failing with a connection error.

    No telemetry. No phone home. Fonts are served from the box, not from a
    CDN.

  developer: 'kaivo.studio'
  website: 'https://aimighty.de'
  sourceCode: 'https://github.com/ska1walker/beacon'
  license:
    - text: Proprietary
      url: 'https://aimighty.de'

  requiredMemory: '1Gi'
  limitedMemory: '2Gi'
  requiredDisk: '1Gi'
  limitedDisk: '5Gi'
  requiredCpu: '0.2'
  limitedCpu: '2'

  # Nur amd64: release.yml baut nur dafür. Ein arm64-Versprechen ohne
  # Abbild dahinter wäre ein Installationsfehler, der erst auf der
  # falschen Box auffällt.
  supportArch:
    - amd64

options:
  # apiVersion v3 verlangt genau diese Form: offen nach oben, mit '-0',
  # damit Tages- und RC-Builds der Box (1.12.6-2026…) mitzählen. Ein
  # geschlossenes Intervall hat Insilo einmal genau von der Version
  # ausgesperrt, auf der die Box lief.
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'

  allowMultipleInstall: false

  # Kein Zeitlimit am Envoy-Sidecar. Ohne diese Angabe kappt er jede
  # Antwort nach 15 Sekunden — und das Modell antwortet synchron im
  # Request: Notiz→Struktur, Briefing, Anreicherung (auf der Box gemessen:
  # 16 Sekunden für eine Firma, bei einem nachdenkenden Modell mehr).
  apiTimeout: 0

  # Ausgehend: HTTPS zum Sprachmodell (auf der Box über dessen öffentliche
  # Adresse), zu den Websites der Firmen für die Anreicherung, zum
  # Suchdienst und zu Relay. Port 80 nur, weil Firmen-Websites noch
  # gelegentlich per http antworten und erst dann auf https umleiten.
  allowedOutboundPorts:
    - 443
    - 80

  # Nie als root — die Abbilder laufen mit UID 1000.
  runAsUser: "1000"

  # Je Nutzer installiert. Olares setzt damit das ns-owner-Label, das die
  # NetworkPolicy zu Postgres und Authelia öffnet.
  appScope:
    clusterScoped: false

  # Bewusst **keine** `policies`. Hier stand bis 0.1.6 eine Unterregel auf
  # '/' mit `level: two_factor` und `validDuration: 3600s`. Das klang nach
  # Sorgfalt und war ein Bedienfehler: Es fordert *zusätzlich* zur
  # Box-Anmeldung stündlich einen zweiten Faktor, nur für diese eine App.
  #
  # Keine andere App auf einer Olares-Box tut das — Insilo nicht, der
  # Passwort-Tresor nicht, die Systemeinstellungen nicht. Alle laufen auf
  # `default_policy: system` und damit auf der Sitzung, die beim Anmelden
  # an der Box entsteht. Wer davon abweicht, schützt nichts zusätzlich:
  # Wer die Box-Sitzung hat, hat ohnehin Zugriff auf Dateien, Tresor und
  # Einstellungen. Er erzieht nur dazu, den zweiten Faktor im Halbschlaf
  # wegzuklicken — und das ist eine Verschlechterung, keine Härtung.
  #
  # Der Schutz von Beacon hängt seit 0.8.4 **nicht mehr am Entrance**. Der
  # steht oben auf `public`, weil das Team von außerhalb des Netzes
  # arbeitet und eine Olares-App je Nutzer installiert wird — ein zweites
  # Box-Konto bekäme ein eigenes, leeres Beacon und sähe den Bestand
  # nicht. Der Envoy-Sidecar prüft damit nichts mehr vor.
  #
  # Die einzige Wand ist Beacons eigene Anmeldung: `ANMELDUNG_MODUS=eigen`
  # steht als Literal in den Deployments (nicht in `values.yaml`, die ein
  # Upgrade einfriert). In diesem Modus wird `X-Bfl-User` **vollständig
  # ignoriert** — er bringt weder Zugang noch legt er einen Nutzer an.
  # Genau das ist der Punkt, an dem diese Datei und `backend/app/auth.py`
  # zusammen stimmen müssen; `test_anmeldung.py` hält ihn fest.
