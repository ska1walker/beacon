# ============================================================================
# Der öffentliche Pfad (app/oeffentlich.py): Bestätigen, Abmelden, Klick.
#
# Ein eigenes Deployment, weil der Entrance `beaconlinks` darauf zeigt und
# ein Entrance dem Pod einen Envoy-Sidecar bringt. Der Sidecar prüft jeden
# eingehenden Aufruf gegen Authelia — säße er am Backend-Pod, käme das
# Frontend nicht mehr an /api (gemessen 5.9.2026: 401, ext_authz_denied).
# Hier stört er nicht: Der Entrance ist `public`, der Sidecar lässt durch.
#
# Kein /app/data, keine Migrationen: Dieser Prozess liest genau eine
# Link-Zeile je Aufruf und schreibt über den Organisationseigentümer.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon-links
  namespace: {{ .Release.Namespace }}
  labels:
    app: beacon
    component: links
spec:
  # `index`, weil der Name einen Bindestrich trägt. Kein `default`
  # dahinter: Olares' Linter verlangt genau diese Form — und braucht
  # sie nicht: `workloads` kommt bei jedem Markt-Upgrade frisch aus
  # `workloadReplicas` im Manifest (auf der Box gemessen: user-supplied,
  # genau die Schlüssel des jeweiligen Manifests), nicht aus den
  # eingefrorenen Installationswerten.
  replicas: {{ (index .Values.workloads "beacon-links").replicaCount }}
  selector:
    matchLabels:
      app: beacon
      component: links
  template:
    metadata:
      labels:
        app: beacon
        component: links
    spec:
      containers:
        - name: oeffentlich
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["uvicorn", "app.oeffentlich:app", "--host", "0.0.0.0", "--port", "8001"]
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: DB_HOST
              value: "{{ .Values.postgres.host }}"
            - name: DB_PORT
              value: "{{ .Values.postgres.port }}"
            - name: DB_USER
              value: "{{ .Values.postgres.username }}"
            - name: DB_PASSWORD
              value: "{{ .Values.postgres.password }}"
            - name: DB_NAME
              value: "{{ .Values.postgres.databases.beacon }}"
            - name: APP_DATA_DIR
              value: "/app/data"
            - name: DEV_USER
              value: ""
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 30
