# ============================================================================
# ERZEUGT — nicht von Hand ändern.
#
# Quelle: supabase/migrations/*.sql
# Neu erzeugen: python3 scripts/regen-migrations.py
#
# Das SQL steht hier eingebettet, weil der Markt-Linter `.Files.Get`
# ablehnt. Der Vorlauf-Container des Backends hängt diese ConfigMap unter
# /sql ein und spielt die Dateien in Namensreihenfolge ein.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: beacon-migrations
  namespace: {{ .Release.Namespace }}
  labels:
    app: beacon
data:
  0001_initial_schema.sql: |
    -- ========================================================================
    -- 0001_initial_schema.sql
    -- Grundschema für Beacon auf Olares.
    --
    -- Wie bei Insilo: keine eigene auth-Tabelle. Die Identität kommt aus dem
    -- Olares-Header X-Bfl-User; wir mappen den Olares-Namen auf eine interne
    -- UUID. Alles Weitere hängt an org_id — Mandantentrennung ab Zeile eins.
    -- ========================================================================

    create extension if not exists "uuid-ossp";
    create extension if not exists "pgcrypto";
    create extension if not exists "pg_trgm";
    -- `vector` fehlt hier mit Absicht. Diese Ausbaustufe rechnet keine
    -- Einbettungen; die Erweiterung kommt mit der Ask-Funktion und dann in
    -- einer eigenen Migration. Was nicht gebraucht wird, wird nicht angelegt —
    -- sonst scheitert die lokale Einrichtung an etwas, das niemand benutzt.

    -- ========================================================================
    -- IDENTITÄT
    -- ========================================================================

    create table public.users (
      id              uuid primary key default uuid_generate_v4(),
      olares_username text not null unique,
      email           text,
      display_name    text,
      created_at      timestamptz not null default now(),
      last_seen_at    timestamptz not null default now(),
      deleted_at      timestamptz
    );

    create index users_olares_idx on public.users (olares_username) where deleted_at is null;

    create table public.orgs (
      id              uuid primary key default uuid_generate_v4(),
      name            text not null,
      slug            text unique not null,
      settings        jsonb not null default '{}'::jsonb,
      created_at      timestamptz not null default now(),
      updated_at      timestamptz not null default now(),
      deleted_at      timestamptz
    );

    create type public.user_role as enum ('owner', 'admin', 'member', 'viewer');

    create table public.user_org_roles (
      user_id         uuid not null references public.users(id) on delete cascade,
      org_id          uuid not null references public.orgs(id) on delete cascade,
      role            public.user_role not null default 'member',
      joined_at       timestamptz not null default now(),
      primary key (user_id, org_id)
    );

    create index user_org_roles_user_idx on public.user_org_roles (user_id);
    create index user_org_roles_org_idx on public.user_org_roles (org_id);

    -- ========================================================================
    -- FIRMEN
    --
    -- lifecycle_stage folgt der HubSpot-Leiter, aber gekürzt auf das, was ein
    -- Zwei-Mann-Vertrieb wirklich unterscheidet. Wer mehr Stufen einführt,
    -- führt sie hier ein — nicht als freien Text in der Oberfläche.
    -- ========================================================================

    create type public.lifecycle_stage as enum (
      'lead',          -- kennt uns, ungeprüft
      'qualified',     -- Bedarf und Budget plausibel
      'opportunity',   -- offener Deal vorhanden
      'customer',      -- gekauft
      'partner',
      'disqualified'
    );

    create table public.companies (
      id              uuid primary key default uuid_generate_v4(),
      org_id          uuid not null references public.orgs(id) on delete cascade,
      name            text not null,
      domain          text,
      industry        text,
      employee_count  integer,
      city            text,
      country         text default 'DE',
      phone           text,
      website         text,
      lifecycle_stage public.lifecycle_stage not null default 'lead',
      source          text,                                  -- Messe, Empfehlung, Website …
      description     text,
      -- Was die KI über die Firma zusammengetragen hat. Getrennt von
      -- description, damit von Hand Geschriebenes nie überschrieben wird.
      ai_summary      text,
      ai_summary_at   timestamptz,
      owner_id        uuid references public.users(id),
      created_by      uuid references public.users(id),
      created_at      timestamptz not null default now(),
      updated_at      timestamptz not null default now(),
      deleted_at      timestamptz
    );

    create index companies_org_idx on public.companies (org_id) where deleted_at is null;
    create index companies_name_trgm on public.companies using gin (name gin_trgm_ops);
    create unique index companies_org_domain_uniq on public.companies (org_id, lower(domain))
      where domain is not null and deleted_at is null;

    -- ========================================================================
    -- KONTAKTE
    -- ========================================================================

    create table public.contacts (
      id              uuid primary key default uuid_generate_v4(),
      org_id          uuid not null references public.orgs(id) on delete cascade,
      company_id      uuid references public.companies(id) on delete set null,
      first_name      text,
      last_name       text,
      email           text,
      phone           text,
      mobile          text,
      job_title       text,
      -- Entscheider, Anwender, Blockierer: wer im Kaufprozess was tut.
      buying_role     text,
      linkedin_url    text,
      lifecycle_stage public.lifecycle_stage not null default 'lead',
      source          text,
      notes           text,
      ai_summary      text,
      ai_summary_at   timestamptz,
      owner_id        uuid references public.users(id),
      created_by      uuid references public.users(id),
      created_at      timestamptz not null default now(),
      updated_at      timestamptz not null default now(),
      deleted_at      timestamptz
    );

    create index contacts_org_idx on public.contacts (org_id) where deleted_at is null;
    create index contacts_company_idx on public.contacts (company_id) where deleted_at is null;
    create unique index contacts_org_email_uniq on public.contacts (org_id, lower(email))
      where email is not null and deleted_at is null;
    create index contacts_name_trgm on public.contacts
      using gin ((coalesce(first_name,'') || ' ' || coalesce(last_name,'')) gin_trgm_ops);

    -- ========================================================================
    -- PIPELINES
    --
    -- Stufen sind Datensätze, keine Enum-Werte: der Vertrieb ändert seinen
    -- Ablauf öfter, als wir migrieren wollen. Die Wahrscheinlichkeit hängt an
    -- der Stufe, damit die Prognose ohne Zutun rechnet.
    -- ========================================================================

    create table public.pipelines (
      id              uuid primary key default uuid_generate_v4(),
      org_id          uuid not null references public.orgs(id) on delete cascade,
      name            text not null,
      is_default      boolean not null default false,
      position        integer not null default 0,
      created_at      timestamptz not null default now(),
      deleted_at      timestamptz
    );

    create index pipelines_org_idx on public.pipelines (org_id) where deleted_at is null;

    create type public.stage_kind as enum ('open', 'won', 'lost');

    create table public.pipeline_stages (
      id              uuid primary key default uuid_generate_v4(),
      org_id          uuid not null references public.orgs(id) on delete cascade,
      pipeline_id     uuid not null references public.pipelines(id) on delete cascade,
      name            text not null,
      kind            public.stage_kind not null default 'open',
      probability     numeric(4,3) not null default 0.100,   -- 0,000 … 1,000
      position        integer not null default 0,
      created_at      timestamptz not null default now()
    );

    create index pipeline_stages_pipeline_idx on public.pipeline_stages (pipeline_id, position);

    -- ========================================================================
    -- DEALS
    -- ========================================================================

    create type public.deal_product as enum (
      'assistent',
      'analyst',
      'experte',
      'service',
      'sonstiges'
    );

    create table public.deals (
      id              uuid primary key default uuid_generate_v4(),
      org_id          uuid not null references public.orgs(id) on delete cascade,
      company_id      uuid references public.companies(id) on delete set null,
      pipeline_id     uuid not null references public.pipelines(id),
      stage_id        uuid not null references public.pipeline_stages(id),
      name            text not null,
      product         public.deal_product not null default 'sonstiges',
      -- Netto in Cent. Kein float: 9.900 € sind 990000, und das bleibt exakt.
      amount_cents    bigint not null default 0,
      currency        char(3) not null default 'EUR',
      service_days    integer,
      close_date      date,
      -- Gefüllt, sobald der Deal auf einer Stufe der Art won/lost landet.
      closed_at       timestamptz,
      lost_reason     text,
      next_step       text,
      ai_summary      text,
      ai_summary_at   timestamptz,
      owner_id        uuid references public.users(id),
      created_by      uuid references public.users(id),
      created_at      timestamptz not null default now(),
      updated_at      timestamptz not null default now(),
      deleted_at      timestamptz
    );

    create index deals_org_idx on public.deals (org_id) where deleted_at is null;
    create index deals_stage_idx on public.deals (stage_id) where deleted_at is null;
    create index deals_company_idx on public.deals (company_id) where deleted_at is null;
    create index deals_close_date_idx on public.deals (org_id, close_date) where deleted_at is null;

    -- Ein Deal hat mehrere Beteiligte. Die Rolle steht hier und nicht am
    -- Kontakt: dieselbe Person kann im einen Geschäft entscheiden und im
    -- nächsten nur mitreden.
    create table public.deal_contacts (
      deal_id         uuid not null references public.deals(id) on delete cascade,
      contact_id      uuid not null references public.contacts(id) on delete cascade,
      role            text,
      primary key (deal_id, contact_id)
    );

    -- ========================================================================
    -- AKTIVITÄTEN — der Verlauf
    --
    -- Eine Tabelle für alles, was am Datensatz passiert ist: Notiz, Anruf,
    -- E-Mail, Termin, Stufenwechsel, KI-Ergebnis. Getrennte Tabellen je Art
    -- hätten drei Abfragen für eine Zeitleiste bedeutet.
    -- ========================================================================

    create type public.activity_kind as enum (
      'note',
      'call',
      'email',
      'meeting',
      'task',
      'stage_change',
      'ai',            -- von der KI erzeugt, immer als solches gekennzeichnet
      'system'
    );

    create table public.activities (
      id              uuid primary key default uuid_generate_v4(),
      org_id          uuid not null references public.orgs(id) on delete cascade,
      kind            public.activity_kind not null,
      subject         text,
      body            text,
      occurred_at     timestamptz not null default now(),
      -- Bezug: mindestens eines gesetzt, erzwungen per CHECK.
      company_id      uuid references public.companies(id) on delete cascade,
      contact_id      uuid references public.contacts(id) on delete cascade,
      deal_id         uuid references public.deals(id) on delete cascade,
      -- Struktur je Art: Dauer eines Anrufs, alte und neue Stufe, Modellname.
      payload         jsonb not null default '{}'::jsonb,
      created_by      uuid references public.users(id),
      created_at      timestamptz not null default now(),
      constraint activities_has_target check (
        company_id is not null or contact_id is not null or deal_id is not null
      )
    );

    create index activities_company_idx on public.activities (company_id, occurred_at desc);
    create index activities_contact_idx on public.activities (contact_id, occurred_at desc);
    create index activities_deal_idx on public.activities (deal_id, occurred_at desc);
    create index activities_org_idx on public.activities (org_id, occurred_at desc);

    -- ========================================================================
    -- AUFGABEN
    -- ========================================================================

    create type public.task_status as enum ('open', 'done', 'cancelled');

    create table public.tasks (
      id              uuid primary key default uuid_generate_v4(),
      org_id          uuid not null references public.orgs(id) on delete cascade,
      title           text not null,
      body            text,
      status          public.task_status not null default 'open',
      due_at          timestamptz,
      company_id      uuid references public.companies(id) on delete cascade,
      contact_id      uuid references public.contacts(id) on delete cascade,
      deal_id         uuid references public.deals(id) on delete cascade,
      assigned_to     uuid references public.users(id),
      created_by      uuid references public.users(id),
      completed_at    timestamptz,
      created_at      timestamptz not null default now(),
      updated_at      timestamptz not null default now()
    );

    create index tasks_org_open_idx on public.tasks (org_id, due_at) where status = 'open';
    create index tasks_assigned_idx on public.tasks (assigned_to, due_at) where status = 'open';

    -- ========================================================================
    -- EINSTELLUNGEN JE ORGANISATION
    --
    -- Es gibt bewusst keinen Vorgabewert für die LLM-Adresse — genau wie bei
    -- Insilo seit v0.1.72. Wer kein Modell einträgt, bekommt ein CRM ohne KI,
    -- aber kein CRM, das heimlich irgendwohin spricht.
    -- ========================================================================

    create table public.org_settings (
      org_id          uuid primary key references public.orgs(id) on delete cascade,
      llm_base_url    text,
      llm_model       text,
      -- Im Klartext, geschützt durch RLS — wie bei Insilo. Eine Verschlüsselung
      -- in der Spalte bräuchte einen Schlüssel, der irgendwo liegen muss; auf
      -- der eigenen Box gewinnt das nichts und verliert die Lesbarkeit.
      llm_api_key     text,
      default_currency char(3) not null default 'EUR',
      locale          text not null default 'de',
      updated_at      timestamptz not null default now(),
      updated_by      uuid references public.users(id)
    );

    -- ========================================================================
    -- AUDIT
    -- ========================================================================

    create table public.audit_log (
      id              bigserial primary key,
      org_id          uuid not null references public.orgs(id) on delete cascade,
      actor_id        uuid references public.users(id),
      action          text not null,                         -- create | update | delete
      entity          text not null,                         -- companies | contacts | deals …
      entity_id       uuid,
      diff            jsonb not null default '{}'::jsonb,
      created_at      timestamptz not null default now()
    );

    create index audit_log_org_idx on public.audit_log (org_id, created_at desc);
    create index audit_log_entity_idx on public.audit_log (entity, entity_id);

    -- ========================================================================
    -- updated_at automatisch fortschreiben
    -- ========================================================================

    create or replace function public.touch_updated_at()
    returns trigger
    language plpgsql
    as $$
    begin
      new.updated_at = now();
      return new;
    end;
    $$;

    create trigger companies_touch before update on public.companies
      for each row execute function public.touch_updated_at();
    create trigger contacts_touch before update on public.contacts
      for each row execute function public.touch_updated_at();
    create trigger deals_touch before update on public.deals
      for each row execute function public.touch_updated_at();
    create trigger tasks_touch before update on public.tasks
      for each row execute function public.touch_updated_at();
    create trigger orgs_touch before update on public.orgs
      for each row execute function public.touch_updated_at();
  0002_rls_policies.sql: |
    -- ========================================================================
    -- 0002_rls_policies.sql
    -- Row Level Security auf jeder org-gebundenen Tabelle.
    --
    -- Es gibt kein Supabase-Auth. Das Backend setzt beim Öffnen jeder
    -- Verbindung
    --   SET LOCAL app.current_user_id = '<uuid>';
    -- aus dem X-Bfl-User-Header. Die Policies lesen genau diesen Wert. Wer
    -- die Variable nicht setzt, sieht nichts — das ist Absicht.
    -- ========================================================================

    create or replace function public.current_user_id()
    returns uuid
    language sql
    stable
    as $$
      select nullif(current_setting('app.current_user_id', true), '')::uuid;
    $$;

    create or replace function public.current_user_orgs()
    returns setof uuid
    language sql
    stable
    as $$
      select org_id from public.user_org_roles
      where user_id = public.current_user_id();
    $$;

    create or replace function public.current_user_role_in_org(target_org uuid)
    returns public.user_role
    language sql
    stable
    as $$
      select role from public.user_org_roles
      where user_id = public.current_user_id() and org_id = target_org;
    $$;

    -- ========================================================================
    -- Aktivieren
    -- ========================================================================

    alter table public.orgs            enable row level security;
    alter table public.users           enable row level security;
    alter table public.user_org_roles  enable row level security;
    alter table public.companies       enable row level security;
    alter table public.contacts        enable row level security;
    alter table public.pipelines       enable row level security;
    alter table public.pipeline_stages enable row level security;
    alter table public.deals           enable row level security;
    alter table public.deal_contacts   enable row level security;
    alter table public.activities      enable row level security;
    alter table public.tasks           enable row level security;
    alter table public.org_settings    enable row level security;
    alter table public.audit_log       enable row level security;

    -- ========================================================================
    -- Identität
    -- ========================================================================

    create policy users_self on public.users
      for select using (id = public.current_user_id());

    create policy users_self_update on public.users
      for update using (id = public.current_user_id());

    create policy orgs_member on public.orgs
      for select using (id in (select public.current_user_orgs()));

    create policy orgs_admin_write on public.orgs
      for update using (public.current_user_role_in_org(id) in ('owner', 'admin'));

    create policy roles_own on public.user_org_roles
      for select using (org_id in (select public.current_user_orgs()));

    -- ========================================================================
    -- Fachdaten — überall dasselbe Muster: sichtbar und schreibbar innerhalb
    -- der eigenen Organisation. Die Feinsteuerung (wem gehört ein Deal) ist
    -- Sache der Anwendung, nicht der Zeilensicherheit: ein Zwei-Mann-Vertrieb
    -- teilt sich alles, und eine Sichtbarkeitsregel je Besitzer würde nur
    -- Fehler erzeugen, die niemand versteht.
    -- ========================================================================

    create policy companies_org on public.companies
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    create policy contacts_org on public.contacts
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    create policy pipelines_org on public.pipelines
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    create policy pipeline_stages_org on public.pipeline_stages
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    create policy deals_org on public.deals
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    create policy activities_org on public.activities
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    create policy tasks_org on public.tasks
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    create policy org_settings_org on public.org_settings
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    -- deal_contacts trägt keine org_id — sie hängt am Deal. Die Prüfung geht
    -- deshalb über den Deal, nicht über eine zweite Spalte, die auseinander-
    -- laufen könnte.
    create policy deal_contacts_org on public.deal_contacts
      for all using (
        exists (
          select 1 from public.deals d
          where d.id = deal_id and d.org_id in (select public.current_user_orgs())
        )
      )
      with check (
        exists (
          select 1 from public.deals d
          where d.id = deal_id and d.org_id in (select public.current_user_orgs())
        )
      );

    -- Das Protokoll wird gelesen und angehängt, nie geändert oder gelöscht:
    -- dafür gibt es bewusst keine Policy.
    create policy audit_log_read on public.audit_log
      for select using (org_id in (select public.current_user_orgs()));

    create policy audit_log_append on public.audit_log
      for insert with check (org_id in (select public.current_user_orgs()));

    -- ========================================================================
    -- FORCE — der Teil, ohne den alles darüber wirkungslos wäre
    --
    -- Postgres nimmt den Eigentümer einer Tabelle von der Zeilensicherheit
    -- aus. Das Backend verbindet sich auf der Box mit den Zugangsdaten, die
    -- Olares injiziert, und die gehören sehr wahrscheinlich genau diesem
    -- Eigentümer: Ohne FORCE liefen alle Policies oben ins Leere, und zwar
    -- lautlos — kein Fehler, nur plötzlich alle Zeilen aller Mandanten.
    --
    -- Die Identitätstabellen bleiben ausgenommen. Beim ersten Request einer
    -- neuen Kennung gibt es den Nutzerkontext noch nicht, den die Policies
    -- lesen würden; das Anlegen von Nutzer, Organisation und Rolle muss ohne
    -- ihn möglich sein. Danach setzt das Backend den Kontext, und alles
    -- Fachliche unterliegt ihm.
    --
    -- Ein Superuser umgeht auch FORCE. Die Datenbankrolle der Anwendung darf
    -- deshalb keiner sein — siehe docs/BETRIEB.md.
    -- ========================================================================

    alter table public.companies       force row level security;
    alter table public.contacts        force row level security;
    alter table public.pipelines       force row level security;
    alter table public.pipeline_stages force row level security;
    alter table public.deals           force row level security;
    alter table public.deal_contacts   force row level security;
    alter table public.activities      force row level security;
    alter table public.tasks           force row level security;
    alter table public.org_settings    force row level security;
    alter table public.audit_log       force row level security;
  0003_angebote.sql: |
    -- ========================================================================
    -- 0003_angebote.sql
    -- Produktkatalog und Angebote.
    --
    -- Bis hierher endete die Kette bei der Pipelinestufe „Angebot", ohne dass
    -- es ein Angebot gab. Damit fehlte genau das Stück, um das sich der
    -- Vertrieb dreht: Was steht drin, was kostet es, seit wann liegt es beim
    -- Kunden und was hat er gesagt.
    -- ========================================================================

    -- ========================================================================
    -- PRODUKTKATALOG
    --
    -- Die Leiter Assistent / Analyst / Experte steht als Datensatz, nicht als
    -- Aufzählungstyp und nicht als Zahl in der Oberfläche: Preise ändern
    -- sich, und ein Listenpreis, der an drei Stellen gepflegt wird, läuft
    -- auseinander. Der Betrag im Angebot wird beim Anlegen kopiert — ein
    -- späterer Listenpreis darf ein liegendes Angebot nicht rückwirkend
    -- verändern.
    -- ========================================================================

    create type public.product_kind as enum (
      'system',        -- die drei Produkte
      'hardware',
      'service',       -- Servicetage, Einführung
      'subscription'   -- Wartung, Support je Jahr
    );

    create table public.products (
      id                  uuid primary key default uuid_generate_v4(),
      org_id              uuid not null references public.orgs(id) on delete cascade,
      key                 text not null,               -- assistent, analyst, …
      name                text not null,
      description         text,
      kind                public.product_kind not null default 'system',
      list_price_cents    bigint not null default 0,
      default_service_days integer,
      position            integer not null default 0,
      is_active           boolean not null default true,
      created_at          timestamptz not null default now(),
      updated_at          timestamptz not null default now()
    );

    create unique index products_org_key_uniq on public.products (org_id, key);
    create index products_org_idx on public.products (org_id, position) where is_active;

    -- ========================================================================
    -- ANGEBOTE
    -- ========================================================================

    create type public.quote_status as enum (
      'draft',      -- in Arbeit, beim Kunden noch nichts
      'sent',       -- raus
      'accepted',
      'rejected',
      'expired'     -- Bindefrist abgelaufen, ohne Antwort
    );

    create table public.quotes (
      id              uuid primary key default uuid_generate_v4(),
      org_id          uuid not null references public.orgs(id) on delete cascade,
      deal_id         uuid not null references public.deals(id) on delete cascade,
      -- Fortlaufend je Organisation. Die sichtbare Nummer entsteht daraus
      -- (AG-2026-0007); gespeichert wird die Zahl, damit sie sich fortzählen
      -- lässt, ohne einen Text zu zerlegen.
      number_seq      integer not null,
      status          public.quote_status not null default 'draft',
      title           text not null default 'Angebot',
      intro_text      text,
      terms_text      text,
      -- Nachlass auf die Summe, in Cent. Ein Prozentsatz auf der Ebene des
      -- Angebots wäre bei gemischten Positionen nicht mehr nachvollziehbar.
      discount_cents  bigint not null default 0,
      tax_rate        numeric(4,3) not null default 0.190,
      valid_until     date,
      sent_at         timestamptz,
      decided_at      timestamptz,
      decision_note   text,
      created_by      uuid references public.users(id),
      created_at      timestamptz not null default now(),
      updated_at      timestamptz not null default now(),
      deleted_at      timestamptz
    );

    create unique index quotes_org_number_uniq on public.quotes (org_id, number_seq);
    create index quotes_deal_idx on public.quotes (deal_id) where deleted_at is null;
    create index quotes_org_status_idx on public.quotes (org_id, status) where deleted_at is null;

    create table public.quote_items (
      id              uuid primary key default uuid_generate_v4(),
      org_id          uuid not null references public.orgs(id) on delete cascade,
      quote_id        uuid not null references public.quotes(id) on delete cascade,
      -- Nur die Herkunft, keine Preisbindung: Der Betrag steht in dieser
      -- Zeile und bleibt, was er beim Schreiben des Angebots war.
      product_id      uuid references public.products(id) on delete set null,
      position        integer not null default 0,
      title           text not null,
      description     text,
      quantity        numeric(10,2) not null default 1,
      unit_price_cents bigint not null default 0,
      discount_percent numeric(5,2) not null default 0,
      created_at      timestamptz not null default now()
    );

    create index quote_items_quote_idx on public.quote_items (quote_id, position);

    create trigger quotes_touch before update on public.quotes
      for each row execute function public.touch_updated_at();
    create trigger products_touch before update on public.products
      for each row execute function public.touch_updated_at();

    -- ========================================================================
    -- Zeilensicherheit — gleiches Muster, gleiche Härte
    -- ========================================================================

    alter table public.products    enable row level security;
    alter table public.quotes      enable row level security;
    alter table public.quote_items enable row level security;

    alter table public.products    force row level security;
    alter table public.quotes      force row level security;
    alter table public.quote_items force row level security;

    create policy products_org on public.products
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    create policy quotes_org on public.quotes
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    create policy quote_items_org on public.quote_items
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    -- ========================================================================
    -- Angebot als Aktivitätsart
    --
    -- Ein verschicktes Angebot gehört in dieselbe Zeitleiste wie ein Anruf.
    -- Ein eigener Verlauf je Art hätte drei Abfragen für eine Ansicht bedeutet.
    -- ========================================================================

    alter type public.activity_kind add value if not exists 'quote';
  0004_anschriften.sql: |
    -- ========================================================================
    -- 0004_anschriften.sql
    -- Postanschrift der Firma und Absenderangaben der eigenen Organisation.
    --
    -- Beides fehlte, und beides braucht das Angebot: Ein Dokument ohne
    -- Empfängeranschrift und ohne Absender ist kein Angebot, sondern eine
    -- Preisliste. Die Pflichtangaben (Umsatzsteuer-Nummer, Vertretung) hängen
    -- an der Organisation, nicht am Code — sie unterscheiden sich je Betreiber.
    -- ========================================================================

    alter table public.companies
      add column if not exists street       text,
      add column if not exists postal_code  text;

    alter table public.org_settings
      add column if not exists absender_name         text,
      add column if not exists absender_strasse      text,
      add column if not exists absender_plz          text,
      add column if not exists absender_ort          text,
      add column if not exists absender_land         text default 'Deutschland',
      add column if not exists absender_email        text,
      add column if not exists absender_telefon      text,
      add column if not exists absender_website      text,
      add column if not exists ust_id                text,
      add column if not exists vertretung            text,
      add column if not exists registergericht       text,
      add column if not exists bank_iban             text,
      add column if not exists bank_name             text,
      -- Steht unter jedem Angebot. Eine Vorgabe wäre eine Rechtsauskunft, die
      -- wir nicht geben — der Betreiber trägt seine eigenen Bedingungen ein.
      add column if not exists standard_bedingungen  text,
      -- Wie lange ein Angebot vorgabemäßig bindet. 30 Tage sind üblich,
      -- verbindlich ist, was im einzelnen Angebot steht.
      add column if not exists bindefrist_tage       integer default 30;
  0005_qualifizierung.sql: |
    -- ========================================================================
    -- 0005_qualifizierung.sql
    -- Qualifizierung eines Geschäfts und geordnete Verlustgründe.
    --
    -- Bis hierher stand am Deal ein Betrag und eine Stufe. Warum er dort
    -- steht, stand nirgends — und warum ein verlorener verloren ging, stand
    -- als Freitext da und war damit nicht auswertbar. Beides ist die Grundlage
    -- jeder Prognose, die mehr sein soll als eine Summe.
    -- ========================================================================

    -- ========================================================================
    -- VERLUSTGRÜNDE
    --
    -- Als Datensatz, nicht als Aufzählungstyp: Der Vertrieb lernt neue Gründe
    -- kennen, und eine Migration je Erkenntnis wäre der falsche Preis. Der
    -- Freitext am Deal bleibt daneben bestehen — der Grund ist die Kategorie,
    -- die Geschichte steht im Text.
    -- ========================================================================

    create table public.loss_reasons (
      id          uuid primary key default uuid_generate_v4(),
      org_id      uuid not null references public.orgs(id) on delete cascade,
      name        text not null,
      position    integer not null default 0,
      is_active   boolean not null default true,
      created_at  timestamptz not null default now()
    );

    create unique index loss_reasons_org_name_uniq on public.loss_reasons (org_id, name);
    create index loss_reasons_org_idx on public.loss_reasons (org_id, position) where is_active;

    alter table public.deals
      add column if not exists lost_reason_id uuid references public.loss_reasons(id) on delete set null;

    create index deals_lost_reason_idx on public.deals (lost_reason_id) where deleted_at is null;

    -- ========================================================================
    -- QUALIFIZIERUNG
    --
    -- Sechs Felder, nicht sechzig. Was ein Zwei-Mann-Vertrieb tatsächlich
    -- unterscheidet: Wofür, warum jetzt, wer entscheidet, ist Geld da, bis
    -- wann, und passt die Hardware ins Haus. Der letzte Punkt ist bei einem
    -- Gerät im Serverraum kein Detail, sondern der häufigste späte Stolperstein.
    -- ========================================================================

    alter table public.deals
      add column if not exists bedarf              text,
      add column if not exists ausloeser           text,
      add column if not exists entscheider         text,
      add column if not exists budget_geklaert     boolean not null default false,
      add column if not exists zeitrahmen          text,
      add column if not exists standort_geklaert   boolean not null default false,
      -- 0 bis 100. Errechnet aus den Feldern oben, nicht frei gesetzt: Eine
      -- Zahl, die jemand von Hand vergibt, sagt über den Vergebenden mehr aus
      -- als über das Geschäft.
      add column if not exists qualifikation_punkte smallint,
      add column if not exists qualifikation_am    timestamptz;

    -- ========================================================================
    -- Zeilensicherheit
    -- ========================================================================

    alter table public.loss_reasons enable row level security;
    alter table public.loss_reasons force row level security;

    create policy loss_reasons_org on public.loss_reasons
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
  0006_eingang.sql: |
    -- ========================================================================
    -- 0006_eingang.sql
    -- Eingehende Ereignisse aus anderen Anwendungen auf derselben Box.
    --
    -- Zuerst: Insilo. Nach einer Besprechung schickt Insilo ein signiertes
    -- Ereignis mit dem fertigen Protokoll. Das gehört an den Deal, zu dem das
    -- Gespräch gehörte — und genau das ist der Punkt, an dem die beiden
    -- Anwendungen zusammen mehr sind als jede für sich.
    --
    -- Der Vertrag steht in insilo/docs/WEBHOOKS.md und wird hier eingehalten,
    -- nicht neu erfunden.
    -- ========================================================================

    create table public.webhook_sources (
      id          uuid primary key default uuid_generate_v4(),
      org_id      uuid not null references public.orgs(id) on delete cascade,
      name        text not null,
      kind        text not null default 'insilo',
      -- Das geteilte Geheimnis für die HMAC-Prüfung. Es steht im Klartext,
      -- geschützt durch die Zeilensicherheit — verschlüsseln hieße, den
      -- Schlüssel dafür anderswo abzulegen, und das gewinnt auf der eigenen
      -- Box nichts.
      secret      text not null,
      is_active   boolean not null default true,
      created_at  timestamptz not null default now(),
      last_seen_at timestamptz
    );

    create index webhook_sources_org_idx on public.webhook_sources (org_id) where is_active;

    create type public.eingang_status as enum ('offen', 'zugeordnet', 'verworfen');

    create table public.eingang (
      id            uuid primary key default uuid_generate_v4(),
      org_id        uuid not null references public.orgs(id) on delete cascade,
      source_id     uuid not null references public.webhook_sources(id) on delete cascade,
      -- Der Idempotenzschlüssel des Absenders. Über Wiederholungen derselben
      -- Auslieferung bleibt er gleich — genau dafür ist er da.
      delivery_id   text not null,
      event         text not null,
      external_id   text,                       -- die Besprechungs-Kennung bei Insilo
      titel         text,
      markdown      text,
      occurred_at   timestamptz,
      payload       jsonb not null default '{}'::jsonb,
      status        public.eingang_status not null default 'offen',
      company_id    uuid references public.companies(id) on delete set null,
      deal_id       uuid references public.deals(id) on delete set null,
      activity_id   uuid references public.activities(id) on delete set null,
      -- Was die Zuordnung vorgeschlagen hat und warum. Ohne die Begründung
      -- ist eine automatische Zuordnung eine Behauptung.
      zuordnung_grund text,
      created_at    timestamptz not null default now()
    );

    create unique index eingang_lieferung_uniq on public.eingang (source_id, delivery_id);
    create index eingang_offen_idx on public.eingang (org_id, created_at desc) where status = 'offen';
    create index eingang_extern_idx on public.eingang (org_id, external_id);

    -- Aktivitäten aus fremder Quelle sollen nicht doppelt entstehen, wenn
    -- dieselbe Besprechung ein zweites Mal gemeldet wird.
    alter table public.activities
      add column if not exists external_source text,
      add column if not exists external_id     text;

    create unique index if not exists activities_extern_uniq
      on public.activities (org_id, external_source, external_id)
      where external_source is not null and external_id is not null;

    alter table public.webhook_sources enable row level security;
    alter table public.eingang         enable row level security;
    alter table public.webhook_sources force row level security;
    alter table public.eingang         force row level security;

    create policy webhook_sources_org on public.webhook_sources
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    -- Selbstauskunft für den Empfangspfad.
    --
    -- Ein eingehender Webhook trägt keine Olares-Identität — der Absender ist
    -- eine Maschine. Um die Signatur prüfen zu können, muss das Backend aber
    -- genau eine Zeile lesen: die der angesprochenen Quelle. Unter FORCE ROW
    -- LEVEL SECURITY geht das ohne Nutzerkontext nicht, und den gibt es an
    -- dieser Stelle noch nicht — Henne und Ei.
    --
    -- Statt FORCE für diese Tabelle abzuschalten (dann sähe die Liste unter
    -- /api/quellen die Quellen aller Mandanten), gibt diese Policy genau eine
    -- Zeile frei: die, deren Kennung das Backend vorher in die Sitzungs-
    -- variable geschrieben hat. Mehr als die eine angesprochene Quelle ist
    -- damit nicht lesbar, und geschrieben wird über sie gar nichts.
    create policy webhook_sources_selbstauskunft on public.webhook_sources
      for select
      using (id::text = nullif(current_setting('app.webhook_source', true), ''));

    create policy eingang_org on public.eingang
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
  0007_sitzplaetze.sql: |
    -- ========================================================================
    -- 0007_sitzplaetze.sql
    -- Zwei Menschen, ein Olares-Zugang.
    --
    -- Olares installiert Apps pro Nutzer und kennt an einem Entrance nur die
    -- Stufen private, public und internal — es gibt keinen Weg, einen zweiten
    -- Nutzer zusätzlich hereinzulassen. Wer zu zweit dasselbe CRM benutzt,
    -- teilt also einen Olares-Zugang, und `X-Bfl-User` trägt für beide
    -- denselben Namen.
    --
    -- Deshalb unterscheidet Beacon die Personen selbst. Ein Sitzplatz sagt,
    -- wer gerade arbeitet: Besitz, Zuordnung und Protokoll hängen daran.
    --
    -- **Das ist Zuschreibung, keine Anmeldung.** Wer den geteilten Zugang
    -- hat, kann jeden Sitzplatz wählen. Die Grenze, die trägt, ist die
    -- Organisation: ein Sitzplatz muss Mitglied derselben Organisation sein
    -- wie der angemeldete Olares-Nutzer, sonst greift er nicht. Damit lässt
    -- sich über einen Sitzplatz kein fremder Mandant erreichen.
    -- ========================================================================

    create type public.zugang_art as enum (
      -- Meldet sich selbst über Olares an; der Name kommt aus X-Bfl-User.
      'olares',
      -- Eine Person ohne eigenen Olares-Zugang. Sie existiert, damit ihr
      -- Arbeit zugeschrieben werden kann.
      'sitzplatz'
    );

    alter table public.users
      add column if not exists zugang public.zugang_art not null default 'olares';

    -- Wer unter einem Sitzplatz gehandelt hat, soll nachvollziehbar bleiben:
    -- Das Protokoll hält beides fest — die Person und den Zugang, über den
    -- sie hereinkam. Ohne die zweite Angabe sähe es aus, als hätte Marc sich
    -- selbst angemeldet.
    alter table public.audit_log
      add column if not exists actor_login text;

    comment on column public.users.zugang is
      'olares = meldet sich selbst an; sitzplatz = Person ohne eigenen Zugang, '
      'gewählt über X-Beacon-Sitzplatz. Ein Sitzplatz ist Zuschreibung, keine Anmeldung.';
  0008_eigenschaften.sql: |
    -- ========================================================================
    -- 0008_eigenschaften.sql
    -- Eigene Eigenschaften an Firma, Kontakt und Geschäft.
    --
    -- Das feste Schema trägt, was jeder Vertrieb braucht. Was nur dieser
    -- Vertrieb braucht — „Serverraum vorhanden", „Kammerzugehörigkeit",
    -- „Wartungsvertrag bis" — soll niemand als Migration nachreichen müssen.
    --
    -- Zwei Teile: die Definition (was es gibt, welcher Typ, welche Auswahl)
    -- und der Wert (jsonb am Datensatz, Schlüssel = key der Definition).
    -- Der Wert liegt bewusst nicht in einer eigenen Wertetabelle: Ein
    -- Datensatz mit acht Eigenschaften wäre sonst neun Zeilen, und jede Liste
    -- ein Join zu viel. Geprüft wird beim Schreiben im Backend gegen die
    -- Definition — die Datenbank sieht nur JSON.
    -- ========================================================================

    create type public.property_kind as enum ('text', 'number', 'date', 'bool', 'select');

    create table public.property_definitions (
      id          uuid primary key default uuid_generate_v4(),
      org_id      uuid not null references public.orgs(id) on delete cascade,
      -- Der Tabellenname des Objekts. Als Text mit CHECK statt als Enum:
      -- Ein neues Objekt soll keine Typänderung brauchen.
      entity      text not null check (entity in ('companies', 'contacts', 'deals')),
      -- Der Schlüssel im JSON. Aus der Beschriftung abgeleitet und danach
      -- fest — eine Umbenennung ändert die Beschriftung, nie den Schlüssel,
      -- sonst hingen alle alten Werte in der Luft.
      key         text not null,
      label       text not null,
      kind        public.property_kind not null default 'text',
      -- Nur bei `select`: die erlaubten Werte, als JSON-Liste von Texten.
      options     jsonb not null default '[]'::jsonb,
      description text,
      position    integer not null default 0,
      -- Abschalten statt löschen: Die Werte bleiben in den Datensätzen und
      -- werden nur nicht mehr angezeigt. Ein Löschen, das Werte mitnimmt,
      -- wäre ein Datenverlust hinter einem harmlosen Knopf.
      is_active   boolean not null default true,
      created_at  timestamptz not null default now(),
      updated_at  timestamptz not null default now()
    );

    create unique index property_definitions_uniq on public.property_definitions (org_id, entity, key);
    create index property_definitions_entity_idx on public.property_definitions (org_id, entity, position)
      where is_active;

    create trigger property_definitions_touch before update on public.property_definitions
      for each row execute function public.touch_updated_at();

    alter table public.companies add column if not exists custom jsonb not null default '{}'::jsonb;
    alter table public.contacts  add column if not exists custom jsonb not null default '{}'::jsonb;
    alter table public.deals     add column if not exists custom jsonb not null default '{}'::jsonb;

    alter table public.property_definitions enable row level security;
    alter table public.property_definitions force row level security;

    create policy property_definitions_org on public.property_definitions
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
  0009_kontakt_firmen.sql: |
    -- ========================================================================
    -- 0009_kontakt_firmen.sql
    -- Ein Kontakt, mehrere Firmen.
    --
    -- Ein Steuerberater sitzt in zwei Kanzleien, ein IT-Leiter betreut die
    -- Holding und zwei Töchter. `contacts.company_id` bleibt die Hauptfirma —
    -- die, die in Listen steht und im Angebot oben. Alles Weitere liegt hier.
    -- ========================================================================

    create table public.contact_companies (
      contact_id  uuid not null references public.contacts(id) on delete cascade,
      company_id  uuid not null references public.companies(id) on delete cascade,
      org_id      uuid not null references public.orgs(id) on delete cascade,
      role        text,                       -- was die Person dort tut
      created_at  timestamptz not null default now(),
      primary key (contact_id, company_id)
    );

    create index contact_companies_company_idx on public.contact_companies (company_id);

    alter table public.contact_companies enable row level security;
    alter table public.contact_companies force row level security;

    create policy contact_companies_org on public.contact_companies
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
  0010_verlauf_und_post.sql: |
    -- ========================================================================
    -- 0010_verlauf_und_post.sql
    -- Verlaufseinträge lassen sich zurücknehmen; ein Postausgang bekommt Adresse.
    -- ========================================================================

    -- Eine Notiz, die falsch am Kunden hängt, muss weg können — weich, wie
    -- alles andere. Systemeinträge (Stufenwechsel, KI) bleiben unantastbar.
    alter table public.activities
      add column if not exists deleted_at timestamptz,
      add column if not exists updated_at timestamptz;

    -- Der Postausgang. Marcs Relay (oder jeder andere Dienst) bekommt einen
    -- signierten POST je Nachricht; die Adresse steht hier, nie im Code.
    alter table public.org_settings
      add column if not exists mail_endpoint_url    text,
      add column if not exists mail_endpoint_secret text,
      add column if not exists mail_absender        text;
  0011_anreicherung.sql: |
    -- ========================================================================
    -- 0011_anreicherung.sql
    -- Firmen und Kontakte werden aus öffentlichen Quellen angereichert.
    -- ========================================================================

    -- Kontakte tragen ihre LinkedIn-Adresse seit 0001; Firmen bekommen sie
    -- jetzt auch. Die Unternehmensseite ist die verlässlichste Quelle für
    -- Branche und Größe.
    alter table public.companies
      add column if not exists linkedin_url text;

    -- Der Suchdienst. Ohne ihn kennt die Anreicherung nur die Website der
    -- Firma; mit ihm findet sie Website, LinkedIn-Seite und Personen über die
    -- Treffer einer Suchmaschine. Es gibt keine Vorgabe — wer hier eine
    -- Adresse einträgt, entscheidet, dass Firmennamen dorthin gehen.
    alter table public.org_settings
      add column if not exists suche_endpoint_url text,
      add column if not exists suche_api_key      text,
      -- Läuft die Anreicherung von selbst, sobald eine Firma oder ein Kontakt
      -- angelegt wird?
      add column if not exists anreicherung_automatisch boolean not null default true,
      -- 'leere_felder': gefundene Werte füllen leere Felder ohne Rückfrage,
      --   abweichende Werte bleiben ein Vorschlag.
      -- 'vorschlag': nichts wird ohne Klick geschrieben.
      add column if not exists anreicherung_uebernahme text not null default 'leere_felder'
        check (anreicherung_uebernahme in ('leere_felder', 'vorschlag'));

    -- Jeder Lauf ist ein Datensatz: welche Quellen gelesen wurden, was das
    -- Modell daraus vorgeschlagen hat, was davon übernommen wurde. Ohne diese
    -- Spur wäre ein angereichertes Feld nicht von einem getippten zu
    -- unterscheiden — und genau das muss es sein.
    create table public.anreicherungen (
      id          uuid primary key default uuid_generate_v4(),
      org_id      uuid not null references public.orgs(id) on delete cascade,
      entity      text not null check (entity in ('companies', 'contacts')),
      entity_id   uuid not null,
      status      text not null default 'laeuft'
                  check (status in ('laeuft', 'vorschlag', 'uebernommen', 'verworfen', 'leer', 'fehler')),
      -- [{url, titel, bytes}] — was gelesen wurde, mit Umfang. Das ist der
      -- gemessene Nachweis, was die Box verlassen hat.
      quellen     jsonb not null default '[]'::jsonb,
      -- {feld: {wert, quelle, belegt, lage}} — lage: 'neu' (Feld war leer)
      -- oder 'abweichend' (Feld hatte einen anderen Wert).
      vorschlag   jsonb not null default '{}'::jsonb,
      -- {feld: wert} — was tatsächlich geschrieben wurde.
      uebernommen jsonb not null default '{}'::jsonb,
      fehler      text,
      modell      text,
      created_by  uuid references public.users(id),
      created_at  timestamptz not null default now(),
      updated_at  timestamptz not null default now()
    );

    create index anreicherungen_ziel_idx
      on public.anreicherungen (entity, entity_id, created_at desc);

    alter table public.anreicherungen enable row level security;
    alter table public.anreicherungen force row level security;

    create policy anreicherungen_org on public.anreicherungen
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
  0012_ansichten.sql: |
    -- ========================================================================
    -- 0012_ansichten.sql
    -- Gespeicherte Ansichten: eine Frage an den Bestand, die man wiederfindet.
    -- ========================================================================

    -- Eine Ansicht ist ein Segment plus die Art, es anzusehen: welche
    -- Bedingungen gelten, welche Spalten die Tabelle zeigt, wonach sortiert
    -- wird. In HubSpot ist das der Kern der Arbeit mit Listen — ohne sie ist
    -- jede Suche nach dem Schließen des Reiters wieder weg.
    create table public.ansichten (
      id          uuid primary key default uuid_generate_v4(),
      org_id      uuid not null references public.orgs(id) on delete cascade,
      entity      text not null check (entity in ('companies', 'contacts', 'tickets', 'tasks')),
      name        text not null,
      -- [{feld, operator, wert}] — geprüft in app/segmente.py, nie roh in SQL.
      filter      jsonb not null default '[]'::jsonb,
      -- 'und' | 'oder'
      verknuepfung text not null default 'und' check (verknuepfung in ('und', 'oder')),
      -- Reihenfolge der Spalten, als Liste von Feldschlüsseln.
      spalten     jsonb not null default '[]'::jsonb,
      sort_feld   text,
      sort_richtung text not null default 'desc' check (sort_richtung in ('asc', 'desc')),
      -- Wem die Ansicht gehört. NULL heißt „für alle" — im geteilten Zugang
      -- der Normalfall, aber wer sich eine eigene Arbeitsliste baut, soll sie
      -- nicht jedem in die Leiste hängen.
      owner_id    uuid references public.users(id) on delete set null,
      position    integer not null default 0,
      created_by  uuid references public.users(id),
      created_at  timestamptz not null default now(),
      updated_at  timestamptz not null default now(),
      deleted_at  timestamptz
    );

    create index ansichten_org_idx on public.ansichten (org_id, entity, position)
      where deleted_at is null;

    -- Zwei Ansichten desselben Objekts dürfen nicht gleich heißen — sonst
    -- steht dieselbe Beschriftung zweimal in der Leiste und niemand weiß,
    -- welche gemeint ist.
    create unique index ansichten_name_uniq
      on public.ansichten (org_id, entity, lower(name))
      where deleted_at is null;

    alter table public.ansichten enable row level security;
    alter table public.ansichten force row level security;

    create policy ansichten_org on public.ansichten
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
  0013_tickets.sql: |
    -- ========================================================================
    -- 0013_tickets.sql
    -- Tickets: der Anliegen-Strang neben dem Verkaufs-Strang.
    -- ========================================================================
    --
    -- Ein Ticket ist kein Geschäft. Es hat keinen Betrag und keine
    -- Wahrscheinlichkeit, dafür eine Dringlichkeit und eine Frist, und es
    -- endet nicht „gewonnen" oder „verloren", sondern erledigt. Deshalb
    -- eigene Pipelines statt der Deal-Pipelines: Dieselbe Tabelle für beides
    -- hätte an jeder zweiten Stelle ein „gilt hier nicht" gebraucht.

    create table public.ticket_pipelines (
      id          uuid primary key default uuid_generate_v4(),
      org_id      uuid not null references public.orgs(id) on delete cascade,
      name        text not null,
      is_default  boolean not null default false,
      position    integer not null default 0,
      created_at  timestamptz not null default now(),
      deleted_at  timestamptz
    );

    create index ticket_pipelines_org_idx on public.ticket_pipelines (org_id, position)
      where deleted_at is null;

    -- Die Art einer Stufe sagt, was sie für die Uhr bedeutet:
    --   neu               — hereingekommen, noch niemand dran. Die Reaktionszeit läuft.
    --   offen             — in Arbeit bei uns. Die Lösungszeit läuft.
    --   wartet_auf_kontakt— wir haben geantwortet und warten. Die Uhr pausiert,
    --                       denn die Zeit des Kunden ist nicht unsere Frist.
    --   abgeschlossen     — erledigt. Die Uhr steht.
    create type public.ticket_stufenart as enum ('neu', 'offen', 'wartet_auf_kontakt', 'abgeschlossen');

    create table public.ticket_stages (
      id          uuid primary key default uuid_generate_v4(),
      org_id      uuid not null references public.orgs(id) on delete cascade,
      pipeline_id uuid not null references public.ticket_pipelines(id) on delete cascade,
      name        text not null,
      art         public.ticket_stufenart not null default 'offen',
      position    integer not null default 0,
      created_at  timestamptz not null default now()
    );

    create index ticket_stages_pipeline_idx on public.ticket_stages (pipeline_id, position);

    create type public.ticket_prioritaet as enum ('niedrig', 'mittel', 'hoch', 'dringend');

    -- Woher das Anliegen kam. Nicht kosmetisch: Ein Ticket aus dem Postfach
    -- wird anders beantwortet als eines aus einem Telefonat, und die
    -- Auswertung „woher kommt die Last" braucht die Angabe.
    create type public.ticket_quelle as enum ('manuell', 'email', 'telefon', 'insilo', 'formular');

    create table public.tickets (
      id            uuid primary key default uuid_generate_v4(),
      org_id        uuid not null references public.orgs(id) on delete cascade,
      -- Laufende Nummer je Organisation, wie beim Angebot. Gespeichert wird
      -- die Zahl; die Anzeige (T-2026-0042) entsteht daraus.
      nummer        integer not null,
      betreff       text not null,
      beschreibung  text,
      pipeline_id   uuid not null references public.ticket_pipelines(id),
      stage_id      uuid not null references public.ticket_stages(id),
      prioritaet    public.ticket_prioritaet not null default 'mittel',
      -- Frei, aber aus einer gepflegten Liste (ticket_kategorien).
      kategorie     text,
      quelle        public.ticket_quelle not null default 'manuell',
      -- Wer sich kümmert. NULL heißt „noch niemand" — das ist die Spalte,
      -- nach der die Ansicht „Nicht zugewiesen" fragt.
      owner_id      uuid references public.users(id) on delete set null,
      contact_id    uuid references public.contacts(id) on delete set null,
      company_id    uuid references public.companies(id) on delete set null,
      deal_id       uuid references public.deals(id) on delete set null,
      -- Die drei Zeitpunkte, aus denen sich jede Kennzahl rechnet.
      erste_antwort_am timestamptz,
      geschlossen_am   timestamptz,
      faellig_am       timestamptz,
      custom        jsonb not null default '{}'::jsonb,
      created_by    uuid references public.users(id),
      created_at    timestamptz not null default now(),
      updated_at    timestamptz not null default now(),
      deleted_at    timestamptz
    );

    create unique index tickets_org_nummer_uniq on public.tickets (org_id, nummer);
    create index tickets_org_idx on public.tickets (org_id, updated_at desc) where deleted_at is null;
    create index tickets_stage_idx on public.tickets (stage_id) where deleted_at is null;
    create index tickets_owner_idx on public.tickets (owner_id) where deleted_at is null;
    create index tickets_contact_idx on public.tickets (contact_id) where deleted_at is null;
    create index tickets_betreff_trgm on public.tickets using gin (betreff gin_trgm_ops);

    -- Kategorien als gepflegte Liste, nicht als Freitext im Ticket: Sonst
    -- stehen nach einem Jahr „Rechnung", „rechnung" und „Rechnungsfrage"
    -- nebeneinander und jede Auswertung ist wertlos.
    create table public.ticket_kategorien (
      id          uuid primary key default uuid_generate_v4(),
      org_id      uuid not null references public.orgs(id) on delete cascade,
      name        text not null,
      position    integer not null default 0,
      is_active   boolean not null default true,
      created_at  timestamptz not null default now()
    );

    create unique index ticket_kategorien_uniq on public.ticket_kategorien (org_id, lower(name));

    -- Verlauf und Aufgaben hängen jetzt auch an Tickets. Damit tragen
    -- Zeitleiste, Notizkasten und Aufgabenliste ohne zweite Umsetzung.
    alter table public.activities add column if not exists ticket_id uuid
      references public.tickets(id) on delete cascade;
    alter table public.tasks add column if not exists ticket_id uuid
      references public.tickets(id) on delete cascade;

    create index activities_ticket_idx on public.activities (ticket_id, occurred_at desc);
    create index tasks_ticket_idx on public.tasks (ticket_id) where status = 'open';

    -- Der CHECK aus 0001 verlangte einen der drei alten Bezüge. Ein Ticket
    -- ist ein vierter.
    alter table public.activities drop constraint if exists activities_has_target;
    alter table public.activities add constraint activities_has_target check (
      company_id is not null or contact_id is not null
      or deal_id is not null or ticket_id is not null
    );

    -- Die Frist entsteht aus der Dringlichkeit. Die Stunden stehen in den
    -- Einstellungen, damit sie je Haus anders sein dürfen — eine Kanzlei
    -- misst anders als ein Maschinenbauer.
    alter table public.org_settings
      add column if not exists sla_stunden jsonb not null
        default '{"dringend": 4, "hoch": 8, "mittel": 24, "niedrig": 72}'::jsonb;

    alter table public.ticket_pipelines  enable row level security;
    alter table public.ticket_stages     enable row level security;
    alter table public.tickets           enable row level security;
    alter table public.ticket_kategorien enable row level security;
    alter table public.ticket_pipelines  force row level security;
    alter table public.ticket_stages     force row level security;
    alter table public.tickets           force row level security;
    alter table public.ticket_kategorien force row level security;

    create policy ticket_pipelines_org on public.ticket_pipelines
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    create policy ticket_stages_org on public.ticket_stages
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    create policy tickets_org on public.tickets
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    create policy ticket_kategorien_org on public.ticket_kategorien
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    -- Ansichten gibt es jetzt auch für Tickets. Die Prüfung aus 0012 kannte
    -- sie noch nicht.
    alter table public.ansichten drop constraint if exists ansichten_entity_check;
    alter table public.ansichten add constraint ansichten_entity_check
      check (entity in ('companies', 'contacts', 'tickets', 'tasks'));
  0014_aufgaben.sql: |
    -- ========================================================================
    -- 0014_aufgaben.sql
    -- Aufgaben bekommen Art, Dringlichkeit und eine Phase.
    -- ========================================================================
    --
    -- Bisher war eine Aufgabe ein Titel mit Frist und drei Zuständen. Für
    -- eine Liste, nach der man den Tag plant, fehlten drei Angaben:
    --
    --   **Art** — ein Anruf wird anders erledigt als eine E-Mail. Wer seinen
    --   Tag ordnet, will die Anrufe am Stück machen.
    --   **Dringlichkeit** — sonst steht alles gleich wichtig da, und das
    --   heißt: nichts ist wichtig.
    --   **Phase** — „angefangen“ ist weder offen noch erledigt. Ohne diesen
    --   Zwischenstand steht eine halbfertige Aufgabe jeden Morgen wieder da,
    --   als hätte niemand sie angefasst.
    --
    -- `status` bleibt, was es war, und trägt weiter die Entscheidung
    -- offen/erledigt/verworfen. Die Phase ist die feinere Auskunft
    -- **innerhalb** von „offen"; beide werden beim Abhaken zusammen gesetzt.

    create type public.aufgaben_art as enum ('todo', 'anruf', 'email', 'termin');
    create type public.aufgaben_phase as enum ('nicht_gestartet', 'in_arbeit', 'wartet');

    alter table public.tasks
      add column if not exists art public.aufgaben_art not null default 'todo',
      add column if not exists phase public.aufgaben_phase not null default 'nicht_gestartet',
      add column if not exists prioritaet public.ticket_prioritaet not null default 'mittel',
      -- Erledigte Aufgaben brauchen keine Phase mehr; für die offenen ist sie
      -- die zweite Sortierung nach der Frist.
      add column if not exists updated_by uuid references public.users(id);

    create index tasks_phase_idx on public.tasks (org_id, phase) where status = 'open';
    create index tasks_art_idx on public.tasks (org_id, art) where status = 'open';

    -- Ansichten gelten jetzt auch für Aufgaben.
    alter table public.ansichten drop constraint if exists ansichten_entity_check;
    alter table public.ansichten add constraint ansichten_entity_check
      check (entity in ('companies', 'contacts', 'tickets', 'tasks'));
  0015_mehrfachauswahl.sql: |
    -- ========================================================================
    -- 0015_mehrfachauswahl.sql
    -- Eine eigene Eigenschaft, die mehrere Werte gleichzeitig trägt —
    -- und eine Optionsliste, die sich umbenennen lässt.
    --
    -- ## Warum eine Liste, kein getrennter Text
    --
    -- Bisher hielt `select` genau einen Wert. Das reicht für „Region", aber
    -- nicht für die Fragen, die im Vertrieb tatsächlich gestellt werden:
    -- welche Produkte interessieren, welche Zertifikate liegen vor, an
    -- welchen Messen war die Firma. Solche Angaben sind Mengen, und wer sie
    -- in ein Textfeld presst („ISO 9001, TISAX"), kann danach nicht mehr
    -- filtern, ohne über Kommas zu raten.
    --
    -- **Der Wert ist eine JSON-Liste.** HubSpots API reiht Mehrfachwerte mit
    -- Semikolon aneinander (`a;b;c`) und hat sich damit ein Jahrzehnt Ärger
    -- eingehandelt: Ein Text „123;456" wurde beim Speichern in zwei Werte
    -- zerlegt, egal ob das Feld mehrwertig war. HubSpot hat das 2024 einzeln
    -- nachgebessert; ein Fluchtzeichen für ein Semikolon *im* Wert gibt es
    -- bis heute nicht. Eine jsonb-Liste hat das Problem nicht.
    --
    -- ## Warum die Option zwei Namen hat
    --
    -- Eine Option war bisher ein Text, der zugleich Anzeige und Speicherwert
    -- war. Das macht jede Umbenennung zum Datenverlust: „Nord" in
    -- „Region Nord" zu ändern, hieße, jeden Datensatz mit „Nord" zu
    -- entwerten. Deshalb trägt eine Option ab hier zwei Felder — `wert`
    -- steht fest, `text` ist frei änderbar — und `verborgen` nimmt sie aus
    -- der Auswahl, ohne sie aus den Datensätzen zu nehmen.
    --
    -- Die Umstellung läuft hier mit: Aus "Nord" wird
    -- {"wert":"Nord","text":"Nord","verborgen":false}. Der Wert bleibt also,
    -- was er war, und alle vorhandenen Datensätze passen weiter.
    --
    -- Der GIN-Index bedient `?|` und `?&`, mit denen die Listenfilter
    -- arbeiten. Ohne ihn wird jede Frage nach „hat eines von" ein
    -- vollständiger Durchlauf.
    -- ========================================================================

    alter type public.property_kind add value if not exists 'multiselect';

    create index if not exists companies_custom_gin on public.companies using gin (custom);
    create index if not exists contacts_custom_gin  on public.contacts  using gin (custom);
    create index if not exists deals_custom_gin     on public.deals     using gin (custom);

    -- Alte Optionslisten in die neue Form bringen. Der EXISTS-Vorbehalt macht
    -- den Schritt wiederholbar: Beim zweiten Lauf steht dort kein Text mehr.
    update public.property_definitions
    set options = (
      select coalesce(jsonb_agg(
        case when jsonb_typeof(o) = 'string'
          then jsonb_build_object('wert', o, 'text', o, 'verborgen', false)
          else o
        end order by ord), '[]'::jsonb)
      from jsonb_array_elements(options) with ordinality as t(o, ord)
    )
    where jsonb_typeof(options) = 'array'
      and exists (
        select 1 from jsonb_array_elements(options) e where jsonb_typeof(e) = 'string'
      );
  0016_ticketeingang.sql: |
    -- ========================================================================
    -- 0016_ticketeingang.sql
    -- Tickets, die von einer Maschine kommen — API, Bot, Formular.
    --
    -- ## Ein Eingang, viele Kanäle
    --
    -- Die naheliegende Lösung wäre je Kanal ein eigener Weg, ein Ticket
    -- anzulegen. Sie ist falsch: Dublettenerkennung, Spam, der Start der
    -- SLA-Uhr und die Frage, wer der Absender ist, sind in jedem Kanal
    -- **dasselbe** Problem. Einmal gelöst ist es ein Feature; viermal gelöst
    -- sind es vier halbe. Also läuft alles über den signierten Pfad, den
    -- 0006 für Insilo gebaut hat, und unterscheidet sich nur in der Quelle.
    --
    -- ## Warum der Absender doppelt gespeichert wird
    --
    -- `contact_id` zeigt auf den Kontakt, wenn die E-Mail einen trifft.
    -- Trifft sie keinen, bleibt sie trotzdem am Ticket stehen — sonst käme
    -- eine Anfrage herein, auf die niemand antworten kann, weil die Adresse
    -- nur im Ereignis-JSON steht. Ein Ticket ohne Rückweg ist kein Ticket,
    -- sondern eine Notiz.
    --
    -- ## Warum eine Quelle entscheidet, ob sie durchregieren darf
    --
    -- Eine Quelle mit Geheimnis ist vertrauenswürdig: Wer signieren kann,
    -- darf ein Ticket anlegen. Ein öffentliches Formular kann kein Geheimnis
    -- halten — was von dort kommt, wartet im Eingang, bis ein Mensch es
    -- ansieht. `tickets_direkt` ist genau diese Unterscheidung, und sie
    -- gehört an die Quelle, nicht in den Code.
    -- ========================================================================

    alter type public.ticket_quelle add value if not exists 'api';
    alter type public.ticket_quelle add value if not exists 'bot';

    alter table public.tickets
      add column if not exists absender_email text,
      add column if not exists absender_name  text;

    -- Für die Zuordnung eingehender Anfragen zu einem vorhandenen Kontakt.
    create index if not exists tickets_absender_idx
      on public.tickets (org_id, lower(absender_email))
      where absender_email is not null and deleted_at is null;

    alter table public.webhook_sources
      add column if not exists tickets_direkt boolean not null default true;

    -- Welches Ticket aus einem Eingangsposten entstanden ist. Ohne diese
    -- Spur wäre nach dem Anlegen nicht mehr nachvollziehbar, woher ein
    -- Ticket kam — und genau das ist die Frage, die man bei einer
    -- Falschmeldung als Erstes stellt.
    alter table public.eingang
      add column if not exists ticket_id uuid references public.tickets(id) on delete set null;

    create index if not exists eingang_ticket_idx on public.eingang (ticket_id)
      where ticket_id is not null;
  0017_postfach.sql: |
    -- ========================================================================
    -- 0017_postfach.sql
    -- Beacon holt Post ab — und fasst dabei nichts an.
    --
    -- ## Warum holen statt geschickt bekommen
    --
    -- Eine Olares-App mit `authLevel: internal` schickt jeden, der ohne
    -- Sitzung kommt, zur Anmeldung (gemessen 5. September 2026, docs/BETRIEB.md
    -- — die erste Fassung dieser Notiz sprach von „keiner öffentlichen
    -- Adresse“; das war ein falscher Hostname). Ein Webhook von außen kommt
    -- so nicht an. Ausgehend ist der Weg dagegen offen — auch auf 993. Also
    -- holt die Anwendung selbst, und niemand muss dafür eine Tür öffnen.
    --
    -- ## Warum eine UID und kein „ungelesen"
    --
    -- Auf demselben Postfach sitzt Relay, und dort liest ein Mensch. Würde
    -- Beacon nach UNSEEN suchen und das Gelesene markieren, verschwände in
    -- Relay der Fettdruck von Post, die niemand geöffnet hat. Ein zweiter
    -- Klient hat sich still zu verhalten: Er merkt sich, bis wohin er
    -- gekommen ist, und fasst keine Markierung an.
    --
    -- `imap_uid_gueltigkeit` gehört dazu, weil eine UID nur innerhalb einer
    -- UIDVALIDITY etwas bedeutet. Ändert der Server sie — nach einem Umzug
    -- etwa —, fangen die Zähler von vorn an, und ein gemerkter Stand zeigte
    -- sonst auf fremde Post.
    --
    -- Das Passwort steht hier wie der LLM-Schlüssel: in der Zeile, nie in
    -- einer Antwort. Die Schnittstelle meldet nur, *ob* eines hinterlegt ist.
    -- ========================================================================

    alter table public.org_settings
      add column if not exists imap_host             text,
      add column if not exists imap_port             integer not null default 993,
      add column if not exists imap_benutzer         text,
      add column if not exists imap_passwort         text,
      add column if not exists imap_ordner           text not null default 'INBOX',
      add column if not exists imap_takt_minuten     integer not null default 5,
      add column if not exists imap_aktiv            boolean not null default false,
      -- Bis wohin gelesen wurde, und in welchem Gültigkeitsraum.
      add column if not exists imap_letzte_uid       bigint,
      add column if not exists imap_uid_gueltigkeit  bigint,
      add column if not exists imap_zuletzt          timestamptz,
      -- Der letzte Fehler im Klartext. Ein Postfach, das seit drei Tagen
      -- nicht antwortet, muss das sagen können — sonst wartet jemand auf
      -- Tickets, die nie kommen, und niemand weiß warum.
      add column if not exists imap_letzter_fehler   text;
  0018_oeffentliche_links.sql: |
    -- ========================================================================
    -- 0018_oeffentliche_links.sql
    -- Ein öffentlicher Pfad — schmal, tokenbasiert, ohne Datenzugriff.
    --
    -- Drei Dinge muss ein Empfänger von außen auslösen können, aus seinem
    -- Mailprogramm, ohne Konto: eine Einwilligung bestätigen, sich abmelden,
    -- einen Link anklicken. Beacon ist `internal` und hat keine öffentliche
    -- Adresse (gemessen, docs/BETRIEB.md). Deshalb bekommt es einen zweiten,
    -- öffentlichen Entrance, hinter dem **nur** diese drei Wege liegen —
    -- eine eigene Anwendung auf einem eigenen Port, die nichts anderes kann.
    -- HubSpot trennt seine Tracking-Domain aus demselben Grund von der App.
    --
    -- Jeder Link ist eine Zeile hier, angesprochen über ein zufälliges Token.
    -- Die Policy unten gibt genau die eine angesprochene Zeile frei, sonst
    -- nichts (Muster: webhook_sources_selbstauskunft). Was danach geschrieben
    -- wird, läuft im Kontext des Organisationseigentümers — wie im Eingang.
    --
    -- Einwilligung steht am Kontakt, mit Nachweis. Marketing-Post in
    -- Deutschland braucht sie belegbar (§7 UWG, DSGVO); „irgendwann mal
    -- angemeldet“ ist kein Beleg. `bestandskunde` ist die Ausnahme aus
    -- §7 Abs. 3 UWG und wird bewusst gesetzt, nie abgeleitet.
    -- ========================================================================

    create type public.link_art as enum ('bestaetigen', 'abmelden', 'klick');

    create type public.einwilligung as enum
      ('keine', 'angefragt', 'bestaetigt', 'bestandskunde', 'abgemeldet');

    alter table public.contacts
      add column if not exists marketing_einwilligung public.einwilligung not null default 'keine',
      add column if not exists einwilligung_am       timestamptz,
      add column if not exists einwilligung_quelle   text,
      -- Der Beleg: Zeitpunkt, Adresse, Token, Herkunft. Ohne ihn ist eine
      -- Einwilligung eine Behauptung.
      add column if not exists einwilligung_nachweis jsonb,
      add column if not exists abgemeldet_am         timestamptz;

    create index if not exists contacts_einwilligung_idx
      on public.contacts (org_id, marketing_einwilligung) where deleted_at is null;

    create table public.oeffentliche_links (
      id            uuid primary key default uuid_generate_v4(),
      org_id        uuid not null references public.orgs(id) on delete cascade,
      -- 32 zufällige Bytes, URL-sicher. Erraten ist keine Option.
      token         text not null unique,
      art           public.link_art not null,
      contact_id    uuid references public.contacts(id) on delete cascade,
      -- Nur bei `klick`: wohin es nach dem Zählen geht.
      ziel_url      text,
      -- Ein Bestätigungslink gilt einmal. Ein Abmeldelink gilt immer — er
      -- darf nie „abgelaufen“ sagen, das wäre eine verweigerte Abmeldung.
      einmalig      boolean not null default false,
      gueltig_bis   timestamptz,
      benutzt_am    timestamptz,
      benutzt_anzahl integer not null default 0,
      payload       jsonb not null default '{}'::jsonb,
      created_at    timestamptz not null default now()
    );

    create index if not exists oeffentliche_links_contact_idx
      on public.oeffentliche_links (contact_id, art);

    alter table public.oeffentliche_links enable row level security;
    alter table public.oeffentliche_links force row level security;

    create policy oeffentliche_links_org on public.oeffentliche_links
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    -- Der öffentliche Pfad hat keine Identität. Er darf genau die Zeile
    -- lesen, deren Token er nennt — und schreiben darf er über sie nichts.
    create policy oeffentliche_links_selbstauskunft on public.oeffentliche_links
      for select
      using (token = nullif(current_setting('app.oeffentlicher_link', true), ''));
  0019_versand.sql: |
    -- ========================================================================
    -- 0019_versand.sql
    -- Mails, die das Haus verlassen — mit Buch darüber.
    --
    -- ## Zwei Wege, bewusst getrennt
    --
    -- Transaktionale Post (Ticket-Antwort, Bestätigungsmail) geht über das
    -- eigene SMTP-Konto: Sie muss aus der Adresse kommen, die der Empfänger
    -- kennt, und sie muss auch dann gehen, wenn kein Dienst eingerichtet ist.
    -- Marketing-Post geht später über einen Dienst (Brevo) oder dasselbe
    -- SMTP — die Wahl steht in `marketing_versand`. HubSpot trennt beides
    -- aus demselben Grund: Ein gesperrtes Marketing-Konto darf keine
    -- Rechnung aufhalten.
    --
    -- ## Warum eine Tabelle und kein Aufruf
    --
    -- Jede Mail ist zuerst eine Zeile und dann ein Versand. Was scheitert,
    -- bleibt mit Grund stehen und wird wieder versucht; was geht, trägt die
    -- Message-ID, an der eine Antwort später hängt. Ohne die Zeile gäbe es
    -- keinen Faden, keinen Beleg und keine Wiederholung.
    --
    -- Passwort und Schlüssel stehen in der Zeile und gehen nie zurück — das
    -- Muster von LLM-Schlüssel und IMAP-Passwort.
    -- ========================================================================

    alter table public.org_settings
      -- Das SMTP-Konto für transaktionale Post.
      add column if not exists smtp_host            text,
      add column if not exists smtp_port            integer not null default 587,
      add column if not exists smtp_benutzer        text,
      add column if not exists smtp_passwort        text,
      -- 'starttls' (587), 'ssl' (465) oder 'keine' (nur im Haus).
      add column if not exists smtp_sicherheit      text not null default 'starttls',
      add column if not exists smtp_absender        text,
      add column if not exists smtp_absender_name   text,
      add column if not exists smtp_zuletzt         timestamptz,
      add column if not exists smtp_letzter_fehler  text,
      -- Marketing: 'smtp' oder 'brevo'.
      add column if not exists marketing_versand    text not null default 'smtp',
      add column if not exists brevo_api_key        text,
      add column if not exists marketing_absender   text,
      add column if not exists marketing_absender_name text,
      -- Die Adresse des öffentlichen Entrance, unter der Bestätigen, Abmelden
      -- und Klick erreichbar sind. Leer heißt: aus der Box-Domain abgeleitet
      -- (siehe app/versand.py). Ein eigener Wert gewinnt — für einen eigenen
      -- Domainnamen oder eine Box, die ihre Domain nicht mitteilt.
      add column if not exists links_basis_url      text,
      -- Betreff und Text der Bestätigungsmail. Leer heißt: die Vorgabe aus
      -- dem Code. Platzhalter (vorname, bestaetigungslink …) in doppelten
      -- geschweiften Klammern, siehe app/versand.py — hier nicht ausgeschrieben,
      -- weil Helm die Klammern auswerten würde.
      add column if not exists doi_betreff          text,
      add column if not exists doi_text             text;

    create type public.mail_art as enum ('transaktional', 'marketing');
    create type public.mail_status as enum ('wartend', 'gesendet', 'fehlgeschlagen');

    create table public.mails (
      id             uuid primary key default uuid_generate_v4(),
      org_id         uuid not null references public.orgs(id) on delete cascade,
      art            public.mail_art not null,
      status         public.mail_status not null default 'wartend',
      contact_id     uuid references public.contacts(id) on delete set null,
      ticket_id      uuid references public.tickets(id) on delete set null,
      an             text not null,
      betreff        text not null,
      text           text not null,
      -- Der Faden: unsere Message-ID, und worauf wir geantwortet haben.
      message_id     text,
      in_reply_to    text,
      referenzen     text,
      versuche       integer not null default 0,
      naechster_versuch timestamptz,
      fehler         text,
      gesendet_am    timestamptz,
      payload        jsonb not null default '{}'::jsonb,
      created_by     uuid references public.users(id),
      created_at     timestamptz not null default now()
    );

    create index if not exists mails_wartend_idx
      on public.mails (org_id, naechster_versuch) where status = 'wartend';
    create index if not exists mails_contact_idx on public.mails (contact_id, created_at desc);
    create index if not exists mails_ticket_idx on public.mails (ticket_id, created_at desc);

    alter table public.mails enable row level security;
    alter table public.mails force row level security;

    create policy mails_org on public.mails
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
  0020_listen_kampagnen.sql: |
    -- ========================================================================
    -- 0020_listen_kampagnen.sql
    -- Listen, Vorlagen, Kampagnen — Marketing-Post an viele, mit Buch.
    --
    -- ## Listen, wie HubSpot sie führt
    --
    -- Eine **statische** Liste ist eine Menge von Hand: Wer drinsteht, steht
    -- drin, bis ihn jemand herausnimmt. Eine **aktive** Liste ist eine Frage
    -- an den Bestand (derselbe Filter wie bei den Ansichten): Wer die
    -- Bedingungen erfüllt, ist drin — heute diese, morgen andere. Beide
    -- tragen eine Kampagne; der Unterschied ist, wann sich die Menge ändert.
    --
    -- ## Warum die Einwilligung nicht in der Liste steht
    --
    -- Die Liste sagt, wen man *meint*. Ob man ihm schreiben *darf*, sagt der
    -- Kontakt (0018). Die Kampagne prüft das beim Start und zählt, wen sie
    -- übergangen hat — die Liste bleibt, wie sie ist, und niemand pflegt
    -- Einwilligungen an zwei Stellen.
    --
    -- ## Klicks
    --
    -- Ein Klick ist ein öffentlicher Link (0018) mit Kampagnenbezug. Gezählt
    -- wird am Link, nicht an der Kampagne: Zahlen entstehen beim Lesen aus
    -- den Zeilen, damit es keinen Zähler gibt, der falsch werden kann.
    -- ========================================================================

    create type public.listen_art as enum ('statisch', 'aktiv');

    create table public.listen (
      id            uuid primary key default uuid_generate_v4(),
      org_id        uuid not null references public.orgs(id) on delete cascade,
      name          text not null,
      beschreibung  text,
      art           public.listen_art not null default 'statisch',
      -- Nur bei `aktiv`: Bedingungen im Format der Ansichten (0012).
      filter        jsonb not null default '[]'::jsonb,
      verknuepfung  text not null default 'und',
      created_by    uuid references public.users(id),
      created_at    timestamptz not null default now(),
      updated_at    timestamptz not null default now(),
      deleted_at    timestamptz
    );

    create index if not exists listen_org_idx on public.listen (org_id) where deleted_at is null;

    create table public.listen_mitglieder (
      liste_id        uuid not null references public.listen(id) on delete cascade,
      contact_id      uuid not null references public.contacts(id) on delete cascade,
      hinzugefuegt_am timestamptz not null default now(),
      hinzugefuegt_von uuid references public.users(id),
      primary key (liste_id, contact_id)
    );

    create index if not exists listen_mitglieder_contact_idx on public.listen_mitglieder (contact_id);

    create table public.vorlagen (
      id            uuid primary key default uuid_generate_v4(),
      org_id        uuid not null references public.orgs(id) on delete cascade,
      name          text not null,
      betreff       text not null,
      text          text not null,
      created_by    uuid references public.users(id),
      created_at    timestamptz not null default now(),
      updated_at    timestamptz not null default now(),
      deleted_at    timestamptz
    );

    create index if not exists vorlagen_org_idx on public.vorlagen (org_id) where deleted_at is null;

    -- `entwurf` → `laeuft` (Zeilen sind im Buch) → fertig ist, was keine
    -- wartende Zeile mehr hat; das wird beim Lesen gerechnet, nicht gespeichert.
    create type public.kampagnen_status as enum ('entwurf', 'laeuft', 'abgebrochen');

    create table public.kampagnen (
      id            uuid primary key default uuid_generate_v4(),
      org_id        uuid not null references public.orgs(id) on delete cascade,
      name          text not null,
      betreff       text not null default '',
      text          text not null default '',
      liste_id      uuid references public.listen(id) on delete set null,
      status        public.kampagnen_status not null default 'entwurf',
      gestartet_am  timestamptz,
      gestartet_von uuid references public.users(id),
      -- Beim Start festgehalten: wie viele die Liste hatte, wie viele ohne
      -- Einwilligung oder Adresse übergangen wurden.
      empfaenger    integer not null default 0,
      uebergangen   integer not null default 0,
      created_by    uuid references public.users(id),
      created_at    timestamptz not null default now(),
      updated_at    timestamptz not null default now(),
      deleted_at    timestamptz
    );

    create index if not exists kampagnen_org_idx on public.kampagnen (org_id) where deleted_at is null;

    alter table public.mails
      add column if not exists kampagne_id uuid references public.kampagnen(id) on delete set null;
    create index if not exists mails_kampagne_idx on public.mails (kampagne_id) where kampagne_id is not null;

    alter table public.oeffentliche_links
      add column if not exists kampagne_id uuid references public.kampagnen(id) on delete set null;
    create index if not exists oeffentliche_links_kampagne_idx
      on public.oeffentliche_links (kampagne_id) where kampagne_id is not null;

    alter table public.listen enable row level security;
    alter table public.listen force row level security;
    alter table public.listen_mitglieder enable row level security;
    alter table public.listen_mitglieder force row level security;
    alter table public.vorlagen enable row level security;
    alter table public.vorlagen force row level security;
    alter table public.kampagnen enable row level security;
    alter table public.kampagnen force row level security;

    create policy listen_org on public.listen
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
    -- Mitglieder hängen an der Liste — die Liste trägt die Organisation.
    create policy listen_mitglieder_org on public.listen_mitglieder
      for all using (liste_id in (select id from public.listen where org_id in (select public.current_user_orgs())))
      with check (liste_id in (select id from public.listen where org_id in (select public.current_user_orgs())));
    create policy vorlagen_org on public.vorlagen
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
    create policy kampagnen_org on public.kampagnen
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
  0021_quellenart.sql: |
    -- ========================================================================
    -- 0021_quellenart.sql
    -- Die Art einer Quelle ist Teil des Vertrags, nicht nur eine Beschriftung.
    --
    -- Bis hier prüften beide Empfangspfade nur Signatur und Freigabe, nicht
    -- die Art: Ein Geheimnis für eine Insilo-Quelle funktionierte auch am
    -- Post-Endpunkt und umgekehrt. Jetzt sagt die Art, welcher Pfad die
    -- Quelle bedienen darf — `relay` für den Postdienst, `email` für das
    -- eigene Postfach (nur intern), alles
    -- andere für Ereignisse und Tickets. Bestehende Zeilen tragen die
    -- Vorgabe `insilo` und funktionieren weiter wie bisher.
    -- ========================================================================

    -- NOT VALID: gilt für alles, was ab jetzt geschrieben wird. Bestehende
    -- Zeilen werden nicht geprüft — die Migration läuft unter FORCE ROW LEVEL
    -- SECURITY ohne Nutzerkontext und könnte sie weder lesen noch berichtigen.
    -- Die Schnittstelle nimmt ohnehin nur diese fünf Werte an.
    alter table public.webhook_sources
      drop constraint if exists webhook_sources_kind_check;
    alter table public.webhook_sources
      add constraint webhook_sources_kind_check
      check (kind in ('insilo', 'api', 'bot', 'formular', 'relay', 'email')) not valid;
  0022_suche_region.sql: |
    -- ========================================================================
    -- 0022_suche_region.sql
    -- Die Suche bekommt ein Land.
    --
    -- „Baustoffhandel Tecklenburger Land“ ohne Region liefert bei Bing Fürth
    -- und bei Brave die USA. Ein Länderkürzel je Organisation geht an beide
    -- Dienste mit: Brave als `country`, SearXNG als Sprache (`de-DE`). Leer
    -- heißt „keine Vorgabe“. Vorgabe ist DE, weil die Firmen im Bestand
    -- dieselbe Vorgabe tragen.
    -- ========================================================================

    alter table public.org_settings
      add column if not exists suche_region text not null default 'DE'
        check (suche_region = '' or suche_region ~ '^[A-Z]{2}$');
  0023_erkenntnisse.sql: |
    -- ========================================================================
    -- 0023_erkenntnisse.sql
    -- Aus Gesprächsnotizen lernen, was am Produkt zu tun ist.
    --
    -- Was Kunden in Gesprächen sagen — Lob, Kritik, Wünsche, Einwände — steht
    -- verstreut im Verlauf. Drei Tabellen machen daraus etwas, das man lesen
    -- kann: `aussagen` sind die einzelnen Sätze, die das Modell aus einer
    -- Notiz zieht, mit Art und Produkt; `auswertungen` merkt sich, welche
    -- Notiz schon gelesen wurde, damit nichts zweimal zählt; `themenlaeufe`
    -- sind die Bündelungen — je Lauf eine Liste von Themen mit den Aussagen
    -- dahinter und dem, was das fürs Produkt heißt. Gerechnet wird aus den
    -- Aussagen, gespeichert wird der Lauf: Man sieht, was gestern galt.
    -- ========================================================================

    create table if not exists public.aussagen (
      id           uuid primary key default uuid_generate_v4(),
      org_id       uuid not null references public.orgs(id) on delete cascade,
      activity_id  uuid not null references public.activities(id) on delete cascade,
      company_id   uuid references public.companies(id) on delete set null,
      art          text not null check (art in ('lob', 'kritik', 'wunsch', 'einwand', 'frage')),
      produkt      text,
      text         text not null,
      zitat        text,
      created_at   timestamptz not null default now()
    );

    create index if not exists aussagen_org_idx on public.aussagen (org_id, created_at desc);
    create index if not exists aussagen_activity_idx on public.aussagen (activity_id);

    create table if not exists public.auswertungen (
      activity_id     uuid primary key references public.activities(id) on delete cascade,
      org_id          uuid not null references public.orgs(id) on delete cascade,
      ausgewertet_am  timestamptz not null default now(),
      modell          text,
      anzahl          integer not null default 0
    );

    create table if not exists public.themenlaeufe (
      id               uuid primary key default uuid_generate_v4(),
      org_id           uuid not null references public.orgs(id) on delete cascade,
      zeitraum_tage    integer not null default 90,
      status           text not null default 'laeuft' check (status in ('laeuft', 'fertig', 'fehler')),
      fortschritt      jsonb not null default '{}'::jsonb,
      aussagen_anzahl  integer not null default 0,
      themen           jsonb not null default '[]'::jsonb,
      fehler           text,
      modell           text,
      created_by       uuid references public.users(id),
      created_at       timestamptz not null default now(),
      updated_at       timestamptz not null default now()
    );

    create index if not exists themenlaeufe_org_idx on public.themenlaeufe (org_id, created_at desc);

    alter table public.aussagen enable row level security;
    alter table public.aussagen force row level security;
    alter table public.auswertungen enable row level security;
    alter table public.auswertungen force row level security;
    alter table public.themenlaeufe enable row level security;
    alter table public.themenlaeufe force row level security;

    create policy aussagen_org on public.aussagen
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
    create policy auswertungen_org on public.auswertungen
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
    create policy themenlaeufe_org on public.themenlaeufe
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
  0024_nutzereinstellungen.sql: |
    -- ========================================================================
    -- 0024_nutzereinstellungen.sql
    -- Was eine Person für sich einstellt — am Menschen, nicht am Zugang.
    --
    -- Favoriten in der Navigation sind eine Vorliebe, kein Geschäftsdatum. Sie
    -- gehören zur Person, die gerade handelt: Marc am Sitzplatz hat seine
    -- eigenen, auf jedem Gerät dieselben. Ein jsonb-Feld am Nutzer reicht —
    -- es wächst mit („dichte" käme später an dieselbe Stelle), braucht keine
    -- eigene Tabelle und reist in der Sicherung im Nutzerblock mit.
    -- ========================================================================

    alter table public.users
      add column if not exists einstellungen jsonb not null default '{}'::jsonb;
  0025_podcasts.sql: |
    -- ========================================================================
    -- 0025_podcasts.sql
    -- Gespräch vorbereiten — der Bestand als kurzer Podcast.
    --
    -- Vor einem Kundengespräch liest niemand dreißig Verlaufseinträge. Ein
    -- Gespräch zweier Stimmen über die Firma — wer sie sind, was zuletzt
    -- geschah, was offen ist, was Kunden gesagt haben — hört man auf dem Weg.
    -- Das Sprachmodell schreibt das Skript aus dem Bestand, die Sprachausgabe
    -- auf der Box spricht es. Nichts verlässt die Box.
    --
    -- `org_settings` bekommt die Sprachausgabe: Adresse, Schlüssel, je Stimme
    -- ein Modell (Speaches führt Piper-Stimmen als Modelle) und ob die
    -- Vorbereitung vor Terminen von selbst läuft. `podcasts` hält je Folge
    -- Skript, Segmente und den Pfad zur Datei unter /app/data — die Datei
    -- überlebt eine Deinstallation, die Zeile geht in der Sicherung mit.
    -- ========================================================================

    alter table public.org_settings
      add column if not exists tts_endpoint_url    text,
      add column if not exists tts_api_key         text,
      add column if not exists tts_modell          text not null default 'speaches-ai/piper-de_DE-thorsten-high',
      add column if not exists tts_stimme          text,
      add column if not exists tts_modell_2        text not null default 'speaches-ai/piper-de_DE-kerstin-low',
      add column if not exists tts_stimme_2        text,
      add column if not exists podcast_automatisch boolean not null default false;

    create table if not exists public.podcasts (
      id           uuid primary key default uuid_generate_v4(),
      org_id       uuid not null references public.orgs(id) on delete cascade,
      entity       text not null check (entity in ('companies', 'deals')),
      entity_id    uuid not null,
      -- Der Termin, für den die Folge entstand — von selbst oder von Hand.
      task_id      uuid references public.tasks(id) on delete set null,
      anlass       text,
      titel        text,
      status       text not null default 'laeuft' check (status in ('laeuft', 'fertig', 'fehler')),
      fortschritt  jsonb not null default '{}'::jsonb,
      skript       text,
      segmente     jsonb not null default '[]'::jsonb,
      dauer_s      integer,
      -- Relativ zu app_data, mit der Org-Kennung von damals im Pfad. Nach
      -- einer Wiederherstellung hat die Organisation eine neue Kennung — der
      -- Pfad wird deshalb gespeichert, nie neu abgeleitet.
      datei        text,
      bytes        bigint,
      modell       text,
      stimme       text,
      llm_modell   text,
      fehler       text,
      created_by   uuid references public.users(id),
      created_at   timestamptz not null default now(),
      updated_at   timestamptz not null default now(),
      deleted_at   timestamptz
    );

    create index if not exists podcasts_entity_idx on public.podcasts (org_id, entity, entity_id, created_at desc);
    -- Ein Termin, eine Folge — auch wenn zwei Schleifen gleichzeitig nachsehen.
    create unique index if not exists podcasts_task_uniq on public.podcasts (task_id) where task_id is not null and deleted_at is null;

    alter table public.podcasts enable row level security;
    alter table public.podcasts force row level security;

    create policy podcasts_org on public.podcasts
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
  0026_anmeldung.sql: |
    -- ========================================================================
    -- 0026_anmeldung.sql
    -- Eine eigene Anmeldung — weil Olares' Konten das nicht leisten können.
    --
    -- Bisher liefert der Envoy-Sidecar die Identität im Kopf `X-Bfl-User`,
    -- und Beacon glaubt ihm. Das trägt genau so weit, wie der Entrance
    -- `internal` ist: Vor dem Pod steht Authelia, ungeprüft kommt niemand
    -- herein. Soll das CRM aber von außen von einem **Team** genutzt werden,
    -- endet dieser Weg. Eine Olares-App wird je Nutzer installiert
    -- (Namensraum `beacon-<nutzer>`); ein zweites Olares-Konto bekäme ein
    -- eigenes, leeres Beacon mit eigener Datenbank. Der einzige geteilte
    -- Modus, die *shared app*, hat laut Olares ausdrücklich keinen Entrance
    -- und keine URL. Für mehrere Menschen in **einem** Bestand führt kein
    -- Weg an einer eigenen Anmeldung vorbei.
    --
    -- Vier Tabellen, jede mit einem Grund:
    --
    --   `users` bekommt den Passwort-Hash. Nur den Hash — argon2id, nie das
    --   Passwort, und `totp_geheimnis` steht schon bereit, damit der zweite
    --   Faktor später keine Migration mehr braucht.
    --
    --   `sitzungen` hält, wer gerade angemeldet ist. Gespeichert wird **nur
    --   der SHA-256 des Tokens**: Wer die Datenbank liest, kann sich damit
    --   nicht anmelden. Serverseitig, damit ein Abmelden wirklich abmeldet —
    --   ein selbstsigniertes Token im Keks wäre bis zum Ablauf gültig, auch
    --   nach dem Klick auf „Abmelden".
    --
    --   `einladungen` ist der einzige Weg, wie ein Mensch dazukommt. Es gibt
    --   keine Registrierung: Wer nicht eingeladen wurde, hat kein Konto.
    --
    --   `anmeldeversuche` ist die Bremse. Ohne sie probiert ein Skript
    --   Passwörter, so schnell die Leitung trägt.
    -- ========================================================================

    alter table public.users
      add column if not exists passwort_hash   text,
      add column if not exists passwort_am     timestamptz,
      add column if not exists totp_geheimnis  text,
      add column if not exists gesperrt_bis    timestamptz;

    create table if not exists public.sitzungen (
      id          uuid primary key default uuid_generate_v4(),
      -- Der SHA-256 des Tokens, nie das Token selbst.
      token_hash  text not null unique,
      user_id     uuid not null references public.users(id) on delete cascade,
      org_id      uuid not null references public.orgs(id) on delete cascade,
      erstellt_am timestamptz not null default now(),
      zuletzt_am  timestamptz not null default now(),
      laeuft_ab   timestamptz not null,
      agent       text,
      beendet_am  timestamptz
    );

    create index if not exists sitzungen_user_idx on public.sitzungen (user_id, erstellt_am desc);
    -- Nach dem Ablauf ist eine Zeile nur noch Ballast; die Schleife räumt sie weg.
    create index if not exists sitzungen_ablauf_idx on public.sitzungen (laeuft_ab);

    create table if not exists public.einladungen (
      id           uuid primary key default uuid_generate_v4(),
      token_hash   text not null unique,
      user_id      uuid not null references public.users(id) on delete cascade,
      org_id       uuid not null references public.orgs(id) on delete cascade,
      erstellt_von uuid references public.users(id),
      erstellt_am  timestamptz not null default now(),
      laeuft_ab    timestamptz not null,
      benutzt_am   timestamptz
    );

    create index if not exists einladungen_org_idx on public.einladungen (org_id, erstellt_am desc);

    -- Die Bremse. Bewusst ohne Bezug zur Organisation: Sie zählt Versuche zu
    -- Kennungen, die es vielleicht gar nicht gibt, und muss gelesen werden
    -- können, **bevor** jemand angemeldet ist.
    create table if not exists public.anmeldeversuche (
      id       bigserial primary key,
      kennung  text not null,
      am       timestamptz not null default now()
    );

    create index if not exists anmeldeversuche_idx on public.anmeldeversuche (kennung, am desc);

    alter table public.sitzungen enable row level security;
    alter table public.sitzungen force row level security;
    alter table public.einladungen enable row level security;
    alter table public.einladungen force row level security;

    -- Die Anmeldung läuft, bevor es einen Nutzerkontext gibt: Wer sich
    -- anmeldet, ist noch niemand. Eine Policy über `current_user_id()` würde
    -- dort alles abweisen. Deshalb dasselbe Muster wie beim öffentlichen Link
    -- (0018): Die Verbindung **nennt den Hash**, um den es geht, und bekommt
    -- genau diese eine Zeile frei. Ein vergessener Filter im Anwendungscode
    -- kann damit trotzdem keine fremde Sitzung sehen.
    create policy sitzungen_selbst on public.sitzungen
      for all using (user_id = public.current_user_id())
      with check (user_id = public.current_user_id());

    create policy sitzungen_token on public.sitzungen
      for all
      using (token_hash = nullif(current_setting('app.anmelde_token', true), ''))
      with check (token_hash = nullif(current_setting('app.anmelde_token', true), ''));

    -- Die Aufräumschleife hat weder Nutzer noch Token. Sie darf genau das
    -- löschen, was sie ohnehin löschen wollte — die Policy ist ihr Prädikat.
    create policy sitzungen_verfallen on public.sitzungen
      for delete using (laeuft_ab < now() - interval '7 days');

    -- Postgres wendet auf ein DELETE mit WHERE-Bedingung zusätzlich die
    -- SELECT-Policies an. Ohne diese Zeile fände die Schleife die Zeile gar
    -- nicht erst und löschte still nichts. Sichtbar wird nur, was seit über
    -- einer Woche keinen Zugang mehr gibt.
    create policy sitzungen_verfallen_sehen on public.sitzungen
      for select using (laeuft_ab < now() - interval '7 days');

    create policy einladungen_org on public.einladungen
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));

    -- Wer den Link hat, ist noch nicht angemeldet — sonst bräuchte er ihn nicht.
    create policy einladungen_token on public.einladungen
      for all
      using (token_hash = nullif(current_setting('app.anmelde_token', true), ''))
      with check (token_hash = nullif(current_setting('app.anmelde_token', true), ''));

    -- `anmeldeversuche` bleibt ohne Zeilensicherheit: Die Tabelle enthält
    -- keine Geschäftsdaten, wird nur ohne Nutzerkontext beschrieben und
    -- gelesen, und eine Policy über `current_user_id()` wäre dort wirkungslos.
  0027_absender.sql: |
    -- ========================================================================
    -- 0027_absender.sql
    -- Jeder Mensch schickt unter seinem eigenen Namen.
    --
    -- Bisher gab es genau einen Absender je Organisation
    -- (`org_settings.smtp_absender`). Sobald zwei Menschen in einem Bestand
    -- arbeiten, ist das falsch: Marcs Angebot ging als Kai hinaus, und die
    -- Antwort landete bei Kai. Der Empfänger sah einen Namen, mit dem er nie
    -- gesprochen hatte.
    --
    -- Zwei Wege, und beide werden gebraucht, weil die Wahl beim
    -- Mailanbieter liegt und nicht bei uns:
    --
    --   **Eigene Adresse auf dem Konto der Organisation.** Nur `From` wechselt,
    --   angemeldet wird weiter mit dem Konto aus den Einstellungen. Das ist
    --   ein Feld und funktioniert bei Anbietern, die eine fremde
    --   Absenderadresse derselben Domain durchlassen. Manche tun das nicht —
    --   one.com etwa weist eine `From`, die nicht dem angemeldeten Postfach
    --   entspricht, je nach Tarif zurück.
    --
    --   **Eigene Zugangsdaten.** Wer sein eigenes Postfach hat, trägt es
    --   hier ein und meldet sich damit selbst an. Das geht immer, kostet aber
    --   ein Postfach je Person.
    --
    -- Die Beschränkung auf dieselbe Domain ist kein Formalismus: Ohne sie
    -- könnte jedes Mitglied über das Konto der Organisation als beliebige
    -- Adresse schreiben — als der Geschäftsführer eines Kunden zum Beispiel.
    -- Wer eigene Zugangsdaten hinterlegt, meldet sich selbst an und darf
    -- deshalb auch eine fremde Domain führen.
    -- ========================================================================

    alter table public.users
      -- Was im `From` steht. Leer heißt: der Absender der Organisation.
      add column if not exists absender_email     text,
      add column if not exists absender_name      text,
      -- Optional das eigene Postfach. Nur vollständig ausgefüllt wirksam.
      add column if not exists smtp_host          text,
      add column if not exists smtp_port          integer,
      add column if not exists smtp_benutzer      text,
      add column if not exists smtp_passwort      text,
      add column if not exists smtp_sicherheit    text;

    -- `users` steht bewusst außerhalb der Zeilensicherheit für Fachdaten
    -- (siehe 0002): Die Tabelle trägt die Identität und muss vor jedem
    -- Nutzerkontext lesbar sein. Der Schutz dieser Spalten liegt deshalb im
    -- Anwendungscode — `PUT /api/mitglieder/wer/absender` schreibt
    -- ausschließlich die Zeile der handelnden Person, nie eine fremde.
  0028_dokumente.sql: |
    -- ========================================================================
    -- 0028_dokumente.sql
    -- Dateien am Datensatz — Angebot als PDF, Lageplan, unterschriebener
    -- Vertrag, das Foto vom Zählerstand.
    --
    -- Bisher konnte ein Mensch alles in Beacon schreiben, aber nichts
    -- hineinlegen. Wer einem Kontakt ein Dokument zuordnen wollte, hängte es
    -- an eine Mail und hoffte, dass der Faden es festhält.
    --
    -- **Die Datei liegt nicht in der Datenbank.** Sie steht unter
    -- `/app/data/dokumente/<org>/<id><endung>` — demselben Pfad wie die
    -- Podcast-Folgen, und dem einzigen, den Olares als dauerhaft zusichert.
    -- Eine Deinstallation nimmt die Datenbank mit, nicht diesen Ordner; die
    -- Zeile hier kommt über den Abzug zurück und findet ihre Datei wieder,
    -- weil der Pfad mitgespeichert ist.
    --
    -- Warum nicht als `bytea` in der Datenbank: Ein Abzug wäre dann nicht
    -- mehr 130 Kilobyte, sondern Hunderte Megabyte, jede Stunde neu, und
    -- eine Zeile ließe sich nicht mehr streamen — der ganze Inhalt müsste
    -- durch den Arbeitsspeicher.
    --
    -- `pruefsumme` ist nicht Zierde: Sie sagt, ob die Datei auf der Platte
    -- noch die ist, die einmal hochgeladen wurde, und erkennt dasselbe
    -- Dokument, das jemand zweimal ablegt.
    -- ========================================================================

    create table if not exists public.dokumente (
      id            uuid primary key default uuid_generate_v4(),
      org_id        uuid not null references public.orgs(id) on delete cascade,

      -- Woran es hängt. Genau eines, wie bei `activities` — ein Dokument
      -- gehört an eine Stelle, sonst weiß niemand, wo es zu suchen ist.
      company_id    uuid references public.companies(id) on delete cascade,
      contact_id    uuid references public.contacts(id) on delete cascade,
      deal_id       uuid references public.deals(id) on delete cascade,
      ticket_id     uuid references public.tickets(id) on delete cascade,

      -- Der Name, den der Mensch kennt. Der Pfad auf der Platte trägt ihn
      -- **nicht**: Ein Dateiname aus dem Internet gehört nie in einen Pfad.
      name          text not null,
      pfad          text not null,
      groesse       bigint not null,
      typ           text,
      pruefsumme    text,
      notiz         text,

      hochgeladen_von uuid references public.users(id),
      created_at    timestamptz not null default now(),
      deleted_at    timestamptz,

      constraint dokumente_hat_bezug check (
        company_id is not null or contact_id is not null
        or deal_id is not null or ticket_id is not null
      )
    );

    create index if not exists dokumente_company_idx on public.dokumente (company_id, created_at desc);
    create index if not exists dokumente_contact_idx on public.dokumente (contact_id, created_at desc);
    create index if not exists dokumente_deal_idx    on public.dokumente (deal_id, created_at desc);
    create index if not exists dokumente_ticket_idx  on public.dokumente (ticket_id, created_at desc);
    create index if not exists dokumente_org_idx     on public.dokumente (org_id, created_at desc);

    alter table public.dokumente enable row level security;
    alter table public.dokumente force row level security;

    create policy dokumente_org on public.dokumente
      for all using (org_id in (select public.current_user_orgs()))
      with check (org_id in (select public.current_user_orgs()));
