name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart-checks:
    name: olares chart · sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"

      - name: codified Olares lessons (scripts/check-chart.sh)
        run: bash scripts/check-chart.sh

  frontend:
    name: frontend · typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: install deps
        working-directory: frontend
        run: npm ci

      - name: type-check
        working-directory: frontend
        run: npm run type-check

      - name: unit tests
        working-directory: frontend
        run: npx vitest run

      - name: build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: backend · ruff + pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        working-directory: backend
        run: ruff check .

      # Die Tests laufen mit derselben Rolle wie die Anwendung auf der
      # Box: kein Superuser. Nur so prüfen sie, dass FORCE ROW LEVEL
      # SECURITY greift — ein Superuser sähe alles und die Tests zur
      # Mandantentrennung schlügen fehl.
      - name: create application role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c \
            "create role beacon login password 'beacon_dev_only' createdb;"

      - name: pytest
        working-directory: backend
        run: python -m pytest -q
        env:
          TEST_DB_HOST: localhost
          TEST_DB_USER: beacon
          TEST_DB_PASSWORD: beacon_dev_only
